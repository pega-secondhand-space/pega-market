<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="doc-site-title">PEGAPEGA</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .animate-fadeIn { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
  
    
    /* 全站動態字體大小控管 (PC 與 手機響應式獨立放大) */
    html.font-level-sm { font-size: 14px; }
    html.font-level-base { font-size: 16px; }
    html.font-level-lg { font-size: 18px; }
    html.font-level-xl { font-size: 20px; }

    /* 手機版 (寬度 < 640px) 超大字體強效放大 */
    @media (max-width: 639px) {
      html.font-level-sm { font-size: 18px; }
      html.font-level-base { font-size: 20px; }
      html.font-level-lg { font-size: 22px; }
      html.font-level-xl { font-size: 25px; } /* 手機特大字體直升 25px */
    }


  </style>
</head>
<body id="main-body" class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans transition-all duration-300 bg-cover bg-center bg-fixed">

  <!-- 除錯與系統錯誤提示框 -->
  <div id="debug-error-box" class="hidden bg-red-600/90 text-white text-xs font-bold px-4 py-2 text-center sticky top-0 z-50 shadow-md"></div>

  <!-- 浮動 Notification Toast 提示框 -->
  <div id="toast-container" class="fixed top-20 right-6 z-[9999] flex flex-col gap-2 pointer-events-none max-w-sm"></div>



  <!-- 頂部導航欄 (Navbar) -->
  <header class="bg-gray-900/90 backdrop-blur-md border-b border-gray-800 sticky top-0 z-40 shadow-xl">
    <div class="max-w-6xl mx-auto px-4 py-3 space-y-2">
      <!-- 置頂最上面一行：網站平台名稱 (大器突出) -->
      <div class="flex items-center justify-between">
        <h1 onclick="refreshPageData()" title="點擊一鍵重新整理資料" class="text-xl sm:text-2xl font-black bg-gradient-to-r from-indigo-400 via-purple-300 to-amber-300 bg-clip-text text-transparent cursor-pointer hover:opacity-80 transition flex items-center gap-2">
          <span id="site-title-text">PEGAPEGA [🧪 測試沙盒]</span>
          <i class="fa-solid fa-rotate-right text-xs text-indigo-400"></i>
        </h1>

        <div class="flex items-center gap-2 flex-wrap sm:flex-nowrap">

        <!-- 全站動態字體大小調整按鈕 (文 A⁻ / A / A⁺ / A⁺⁺) -->
        <div class="flex items-center gap-1 bg-gray-950/80 p-1 rounded-xl border border-gray-800 shrink-0">
          <span class="text-[10px] text-gray-400 font-bold px-1.5 hidden sm:inline">字體:</span>
          <button onclick="setFontSize('sm')" id="font-btn-sm" class="px-2 py-1 rounded-lg text-xs font-bold transition text-gray-400 hover:text-white hover:bg-gray-800" title="小字體 (A⁻)">A⁻</button>
          <button onclick="setFontSize('base')" id="font-btn-base" class="px-2 py-1 rounded-lg text-xs font-bold transition bg-indigo-600 text-white shadow" title="標準字體 (A)">A</button>
          <button onclick="setFontSize('lg')" id="font-btn-lg" class="px-2 py-1 rounded-lg text-xs font-bold transition text-gray-400 hover:text-white hover:bg-gray-800" title="大字體 (A⁺)">A⁺</button>
          <button onclick="setFontSize('xl')" id="font-btn-xl" class="px-2 py-1 rounded-lg text-xs font-bold transition text-gray-400 hover:text-white hover:bg-gray-800" title="特大字體 (A⁺⁺)">A⁺⁺</button>
        </div>

          <button onclick="openArchiveModal()" class="px-3 py-1.5 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-xl font-bold text-xs transition flex items-center gap-1">
            <i class="fa-solid fa-handshake text-emerald-400"></i> <span class="hidden sm:inline">成交紀錄</span>
          </button>

          <button onclick="openIssueModal()" class="px-3 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-xl font-bold text-xs transition flex items-center gap-1">
            <i class="fa-solid fa-bug text-amber-400"></i> <span class="hidden sm:inline">回報問題與建議</span>
          </button>

          <button onclick="openAdminModal()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-indigo-300 border border-indigo-500/30 rounded-xl font-bold text-xs transition flex items-center gap-1">
            <i class="fa-solid fa-user-shield text-indigo-400"></i> <span id="admin-btn-text">後台管理</span>
          </button>
        </div>
      </div>
    </div>
  </header>
  <!-- 全站置頂顯眼公告欄 (位在 Header 正下方) -->
  <div id="announcement-bar" class="bg-gradient-to-r from-indigo-950 via-purple-900 to-indigo-950 text-indigo-100 px-3.5 py-3 text-xs sm:text-sm font-bold flex items-start justify-between shadow-xl border-b border-indigo-500/40">
    <div class="flex flex-col sm:flex-row items-start gap-2 max-w-5xl mx-auto w-full">
      <span class="bg-amber-400 text-gray-950 px-2.5 py-0.5 rounded-md text-xs font-black uppercase shrink-0 mt-0.5">📢 全站使用須知</span>
      <span id="announcement-text" class="whitespace-pre-line break-words leading-relaxed font-medium text-gray-100 text-xs sm:text-sm"></span>
    </div>
    <button onclick="closeAnnouncementBar()" class="text-indigo-300 hover:text-white shrink-0 ml-2 p-1"><i class="fa-solid fa-xmark text-base"></i></button>
  </div>

  <!-- 主內容區 -->
  <main class="flex-1 max-w-6xl mx-auto w-full px-3 sm:px-4 py-4 sm:py-6 space-y-5 pb-28 sm:pb-12">

    <!-- 搜尋列、排列切換與篩選 Tab -->
    <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <div class="relative flex-1 sm:w-72">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-xs"></i>
          <input type="text" id="search-input" oninput="filterItems()" placeholder="搜尋物品標題、描述或聯絡資訊..." class="w-full pl-9 pr-4 py-2 bg-gray-900/90 border border-gray-700 rounded-xl text-xs text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition shadow-inner">
        </div>

        <!-- 排列欄數選擇器 (1至5排) -->
        <select id="grid-layout-select" onchange="changeGridLayout(this.value)" class="py-2 px-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs text-indigo-300 font-bold focus:outline-none focus:border-indigo-500 shrink-0">
          <option value="1">單排 1 卡 (大圖)</option>
          <option value="2" selected>雙排 2 卡 (預設)</option>
          <option value="3">三排 3 卡</option>
          <option value="4">四排 4 卡 (電腦)</option>
          <option value="5">五排 5 卡 (寬屏)</option>
        </select>
      </div>

      <!-- 分類 Tab -->
      <div class="flex gap-1.5 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0 text-xs font-bold">
        <button onclick="setFilter('all')" id="filter-all" class="px-4 py-2 rounded-xl bg-indigo-600 text-white transition shadow active:scale-95 shrink-0">全部</button>
        <button onclick="setFilter('sell')" id="filter-sell" class="px-4 py-2 rounded-xl bg-gray-900 border border-gray-700 text-gray-300 hover:bg-gray-800 transition active:scale-95 shrink-0">💰 想賣</button>
        <button onclick="setFilter('buy')" id="filter-buy" class="px-4 py-2 rounded-xl bg-gray-900 border border-gray-700 text-gray-300 hover:bg-gray-800 transition active:scale-95 shrink-0">🔍 想買</button>
        <button onclick="setFilter('free')" id="filter-free" class="px-4 py-2 rounded-xl bg-gray-900 border border-gray-700 text-gray-300 hover:bg-gray-800 transition active:scale-95 shrink-0">🎁 免費送</button>
      </div>
    </div>

    <!-- 告示牌貼文清單 (動態卡片網格，點擊卡片可放大查看詳情) -->
    <div id="grid-container" class="mx-auto max-w-xl">
      <div id="item-grid" class="grid grid-cols-1 gap-6">
        <!-- 動態刊登項目 -->
      </div>

      <!-- 分頁頁碼導航列 (獨立在 grid 外，防擦除/防遮擋設計) -->
      <div id="pagination-container" class="mt-8 flex flex-col sm:flex-row items-center justify-between gap-3 bg-gray-900/95 p-3.5 sm:p-4 rounded-2xl border border-gray-800 text-xs shadow-2xl backdrop-blur-md relative z-20">
        <div class="text-gray-300 font-bold text-center sm:text-left text-[11px] sm:text-xs">
          頁次：<span id="page-current" class="text-indigo-300 font-black">1</span> / <span id="page-total" class="text-gray-200 font-black">1</span> 頁 (共 <span id="items-total-count" class="text-amber-400 font-black">0</span> 筆貼文)
        </div>
        <div class="flex items-center justify-center gap-1.5 font-bold w-full sm:w-auto overflow-x-auto py-1">
          <button onclick="goToPage(1)" id="btn-page-first" class="px-2.5 py-2 bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-300 rounded-xl transition disabled:opacity-30 text-[11px] font-bold shrink-0">⏮ 首頁</button>
          <button onclick="changePage(-1)" id="btn-page-prev" class="px-3 py-2 bg-indigo-900/60 hover:bg-indigo-800 active:scale-95 text-indigo-200 border border-indigo-500/40 rounded-xl transition disabled:opacity-30 text-[11px] font-bold shrink-0">◀ 上一頁</button>
          <span id="page-numbers-span" class="px-2 font-black text-indigo-400 text-xs flex gap-1 items-center shrink-0">1 / 1</span>
          <button onclick="changePage(1)" id="btn-page-next" class="px-3 py-2 bg-indigo-900/60 hover:bg-indigo-800 active:scale-95 text-indigo-200 border border-indigo-500/40 rounded-xl transition disabled:opacity-30 text-[11px] font-bold shrink-0">下一頁 ▶</button>
          <button onclick="goToLastPage()" id="btn-page-last" class="px-2.5 py-2 bg-gray-800 hover:bg-gray-700 active:scale-95 text-gray-300 rounded-xl transition disabled:opacity-30 text-[11px] font-bold shrink-0">末頁 ⏭</button>
        </div>
      </div>
    </div>

  </main>

  <!-- 🔍 商品詳情放大 Modal (完整相片展示，100%不裁切) -->
  <div id="detail-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-2.5 pt-8 sm:p-4">
    <div class="bg-gradient-to-b from-gray-900 via-gray-900 to-indigo-950 border border-indigo-500/40 w-full max-w-2xl rounded-3xl shadow-2xl shadow-indigo-500/20 overflow-hidden flex flex-col max-h-[90vh] animate-fadeIn">
      <!-- 頂部列：右側圓形紅底白字 X 關閉按鈕絕對固定顯示 (任何長標題皆不推擠) -->
      <div class="px-4 py-3.5 bg-gray-950/90 border-b border-indigo-500/30 flex items-center justify-between shrink-0 gap-2">
        <div class="flex items-center gap-2 flex-1 min-w-0 pr-1">
          <span id="detail-type-badge" class="shrink-0"></span>
          <h3 id="detail-title" class="font-black text-sm sm:text-xl text-gray-100 truncate"></h3>
        </div>
        
        <!-- 手機專屬醒目圓形紅底白字 X 關閉按鈕 (保證不被覆蓋也不被推擠) -->
        <button onclick="closeDetailModal()" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-red-600 hover:bg-red-500 text-white font-black text-base shadow-xl flex items-center justify-center border-2 border-white/30 transition active:scale-90 shrink-0 cursor-pointer z-30 ml-1" title="按下關閉視窗">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-5 overflow-y-auto space-y-4">
        <!-- 照片完整顯示區 (100% object-contain 完整全圖展示，防裁切) -->
        <div id="detail-photos-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 rounded-2xl overflow-hidden bg-gray-950/80 border border-gray-700/60 p-2">
          <!-- 動態照片 -->
        </div>

        <!-- 價格與時間 -->
        <div class="flex items-center justify-between">
          <span id="detail-price" class="text-xl font-black text-indigo-400"></span>
          <span id="detail-time" class="text-xs text-gray-400"></span>
        </div>

        <!-- 聯絡資訊方塊 -->
        <div id="detail-contact-box" class="bg-indigo-950/60 border border-indigo-500/40 p-3.5 rounded-xl space-y-1">
          <p class="text-xs font-bold text-indigo-300 flex items-center gap-1.5">
            <i class="fa-solid fa-phone text-indigo-400"></i> 聯絡資訊：
          </p>
          <p id="detail-contact-text" class="text-xs text-gray-100 font-bold break-all"></p>
        </div>

        <!-- 詳細描述 -->
        <div class="space-y-1">
          <p class="text-xs font-bold text-gray-300">物品詳細描述：</p>
          <div id="detail-desc" class="text-xs text-gray-200 leading-relaxed font-medium bg-gray-900/90 p-3.5 rounded-xl border border-gray-700/80 whitespace-pre-line"></div>
        </div>

        <!-- 刊登者 -->
        
        <!-- 刊登者本人下架區域 (方案 A) -->
        <div id="detail-owner-action-box" class="hidden pt-2 border-t border-gray-700/80">
          <button id="detail-owner-delete-btn" onclick="" class="w-full py-2.5 bg-gradient-to-r from-red-800 to-red-900 hover:from-red-700 hover:to-red-800 text-white font-bold text-xs rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
            <i class="fa-solid fa-trash-can text-sm"></i>
            <span>我是發布者：下架此貼文 (已售出 / 結案)</span>
          </button>
        </div>

        <!-- 管理員操作區域 -->
        <div id="detail-admin-action-box" class="hidden pt-2 border-t border-gray-700/80 flex gap-2">
          <button id="detail-admin-pin-btn" onclick="" class="flex-1 py-2.5 bg-gray-900 border border-amber-500/40 text-amber-300 font-bold text-xs rounded-xl transition active:scale-95 flex items-center justify-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-thumbtack text-amber-400"></i>
            <span id="detail-admin-pin-text">置頂</span>
          </button>
          <button id="detail-admin-delete-btn" onclick="" class="px-5 py-2.5 bg-red-950/80 hover:bg-red-900 text-red-300 border border-red-700/60 font-bold text-xs rounded-xl transition active:scale-95 flex items-center justify-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-trash-can text-sm"></i>
            <span>刪除貼文</span>
          </button>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-gray-700 text-xs text-gray-400">
          <span>發布者：<strong id="detail-nickname" class="text-gray-200"></strong></span>
          <span id="detail-expiration"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- 浮動刊登按鈕 (FAB) -->
  <button onclick="openCreateModal()" class="fixed right-5 bottom-6 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold px-5 py-3.5 rounded-full shadow-2xl transition-all duration-300 flex items-center gap-2 active:scale-95 z-30 border border-indigo-400/40">
    <i class="fa-solid fa-plus text-base"></i>
    <span class="text-xs sm:text-sm">我要刊登</span>
  </button>

  <!-- 刊登物品 Modal (支援原生選擇照片檔案自動壓縮上傳資料庫) -->
  <div id="create-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-4">
    <div class="bg-gray-800 border border-gray-700 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-fadeIn">
      <div class="px-5 py-4 bg-gray-900 border-b border-gray-700 flex items-center justify-between shrink-0">
        <h3 class="font-bold text-sm text-gray-100 flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-indigo-400"></i> 我要發布告示牌貼文
        </h3>
        <button onclick="closeCreateModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-5 overflow-y-auto space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">交易類型：</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="setPostType('sell')" id="post-type-sell" class="py-2 rounded-xl border border-indigo-500 bg-indigo-600 text-white font-bold text-xs">💰 想賣</button>
            <button type="button" onclick="setPostType('buy')" id="post-type-buy" class="py-2 rounded-xl border border-gray-700 bg-gray-900 text-gray-300 font-bold text-xs">🔍 想買</button>
            <button type="button" onclick="setPostType('free')" id="post-type-free" class="py-2 rounded-xl border border-gray-700 bg-gray-900 text-gray-300 font-bold text-xs">🎁 免費送</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">物品名稱/標題 <span class="text-amber-400">*</span>：</label>
          <input type="text" id="post-title" placeholder="例如：精美單眼鏡頭清潔組 / 求購二手電風扇" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-100 focus:outline-none focus:border-indigo-500 font-bold">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">價格 (NT$)：</label>
          <input type="number" id="post-price" placeholder="免費送可不填" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-100 focus:outline-none focus:border-indigo-500 font-bold">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">📞 聯絡方式 (分機 / LINE / Teams / 面交地點)：</label>
          <input type="text" id="post-contact" placeholder="例如：分機 45555 / LINE: pega123 / A棟大廳面交" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500 font-bold">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">物品描述：</label>
          <textarea id="post-desc" rows="3" placeholder="請詳細說明物品狀況、規格或交易地點..." class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-100 placeholder-gray-500 resize-none focus:outline-none focus:border-indigo-500 font-medium"></textarea>
        </div>

        <!-- 原生選擇照片檔案上傳資料庫 (最多 2 張照片，自動壓縮) -->
        <div class="space-y-3 bg-gray-900/60 p-3.5 rounded-2xl border border-gray-700/80">
          <label class="block text-xs font-bold text-gray-200 flex items-center justify-between">
            <span>📷 上傳物品照片 (最多選擇 2 張照片，自動上傳資料庫並壓縮展示)：</span>
          </label>
          
          <!-- 上傳按鈕區 -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label for="upload-file-1" class="cursor-pointer bg-gray-800 hover:bg-gray-700 border border-dashed border-indigo-500/60 hover:border-indigo-400 p-3 rounded-xl flex flex-col items-center justify-center text-center transition">
                <i class="fa-solid fa-cloud-arrow-up text-indigo-400 text-lg mb-1"></i>
                <span class="text-[11px] font-bold text-indigo-200">選擇照片 1</span>
                <span id="file1-status" class="text-[9px] text-gray-400">點擊上傳圖檔</span>
              </label>
              <input type="file" id="upload-file-1" accept="image/*" onchange="handleImageSelect(1, event)" class="hidden">
              <input type="hidden" id="post-img1-url">
            </div>

            <div>
              <label for="upload-file-2" class="cursor-pointer bg-gray-800 hover:bg-gray-700 border border-dashed border-gray-600 hover:border-indigo-400 p-3 rounded-xl flex flex-col items-center justify-center text-center transition">
                <i class="fa-solid fa-cloud-arrow-up text-gray-400 text-lg mb-1"></i>
                <span class="text-[11px] font-bold text-gray-300">選擇照片 2 (選填)</span>
                <span id="file2-status" class="text-[9px] text-gray-400">點擊上傳第二張</span>
              </label>
              <input type="file" id="upload-file-2" accept="image/*" onchange="handleImageSelect(2, event)" class="hidden">
              <input type="hidden" id="post-img2-url">
            </div>
          </div>

          <!-- 縮圖預覽區 -->
          <div id="upload-previews-grid" class="hidden grid grid-cols-2 gap-2 pt-2">
            <div id="preview-box-1" class="relative rounded-lg overflow-hidden border border-gray-700 bg-black aspect-video hidden">
              <img id="preview-img-1" class="w-full h-full object-cover">
              <span class="absolute top-1 left-1 bg-black/70 text-white text-[9px] px-1.5 py-0.5 rounded">照片 1</span>
            </div>
            <div id="preview-box-2" class="relative rounded-lg overflow-hidden border border-gray-700 bg-black aspect-video hidden">
              <img id="preview-img-2" class="w-full h-full object-cover">
              <span class="absolute top-1 left-1 bg-black/70 text-white text-[9px] px-1.5 py-0.5 rounded">照片 2</span>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">⏳ 自動下架截止日設定：</label>

      try {

          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }

            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },

    // 原生 HTML5 Canvas 圖片壓縮與 Supabase Storage 上傳邏輯
    async function compressAndUploadImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(event) {
          const img = new Image();
          img.src = event.target.result;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxDim = 1024;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              }
            } else {
              if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(async function(blob) {
              if (!blob) {
                reject(new Error('圖片壓縮失敗'));
                return;
              }

              const filename = `item_${Date.now()}_${Math.random().toString(36).substring(2,7)}.jpg`;
              try {
                const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/item-images/${filename}`, {
                  method: 'POST',
                  headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'image/jpeg'
                  },
                  body: blob
                });

                if (uploadRes.ok) {
                  const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/item-images/${filename}`;
                  resolve(publicUrl);
                } else {
                  reject(new Error('上傳至 Supabase Storage 失敗'));
                }
              } catch(err) {
                reject(err);
              }
            }, 'image/jpeg', 0.85);
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

      const file = event.target.files[0];

        function switchCardPhoto(itemId, dir) {
      const item = allItems.find(i => i.id === itemId);
      if (!item || !item.image_url) return;
      const photos = (item.image_url || '').split('|||').filter(Boolean);
      if (photos.length <= 1) return;

      const imgElem = document.getElementById(`card-img-${itemId}`);
      if (!imgElem) return;

      let curIdx = parseInt(imgElem.getAttribute('data-photo-idx') || '0', 10);
      if (isNaN(curIdx) || curIdx < 0 || curIdx >= photos.length) curIdx = 0;

      // 無縫無限循環計算 (Looping)
      let nextIdx = (dir === 1) ? (curIdx + 1) % photos.length : (curIdx - 1 + photos.length) % photos.length;

      imgElem.src = photos[nextIdx];
      imgElem.setAttribute('data-photo-idx', nextIdx);
    }

    function getCleanDescription(desc) {
      if (!desc) return '';
      return desc.replace(/\[EXP:.*?\]/g, '').replace(/\[SOLD_AT:.*?\]/g, '').trim();
    }

    function isItemSold(item) {

    function getItemSoldTime(item) {

    function getExpirationCountdown(expiresAt) {
      if (!expiresAt) return '<span class="text-gray-400">⏳ 永久展示</span>';
      const now = new Date();
      const exp = new Date(expiresAt);
      const diffMs = exp - now;
      if (diffMs <= 0) return '<span class="text-red-400 font-bold">⚠️ 已到期下架</span>';

      const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
      const diffDays = Math.floor(diffHours / 24);
      const remHours = diffHours % 24;

      if (diffDays > 0) {
        return `<span class="text-amber-400 font-bold">⏳ 剩餘 ${diffDays} 天 ${remHours} 小時下架</span>`;
      } else {
        return `<span class="text-red-400 font-bold animate-pulse">⏳ 剩餘 ${diffHours} 小時下架</span>`;
      }
    }

    function timeAgo(dateStr) {
      if (!dateStr) return '不久前';
      const d = new Date(dateStr);
      const diff = Math.floor((new Date() - d) / 1000);
      if (diff < 60) return '剛才';
      if (diff < 3600) return `${Math.floor(diff/60)} 分鐘前`;
      if (diff < 86400) return `${Math.floor(diff/3600)} 小時前`;
      return `${Math.floor(diff/86400)} 天前`;
    }

      const item = allItems.find(i => i.id === itemId);

      const myItems = JSON.parse(localStorage.getItem('my_created_item_ids') || '[]');
      const hasPermission = (item.device_id === deviceId) || myItems.includes(item.id) || isAdmin;

      const isSold = isItemSold(item);

        showNotification('✅ 成功標記為「已售出」，將於 2 天後自動下架！', 'success');

        // Save transaction log in background
        saveTransactionLog(item, soldTimeStr);

      // Update locally immediately

      renderItems();

      // Update in Supabase database

        await fetch(`${SUPABASE_URL}/rest/v1/items?id=eq.${itemId}`, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_KEY,

          },
          body: JSON.stringify({ description: newDesc })
        });
      } catch(e) {
        console.error('Update description error:', e);
      }
    }

    async function saveTransactionLog(item, soldTimeStr) {
      const logPayload = {
        id: item.id,
        title: item.title,
        price: item.price,
        type: item.type,
        sold_at: soldTimeStr,
        created_at: item.created_at,
        nickname: item.nickname
      };

      try {
        const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/messages?item_id=eq.00000000-0000-0000-0000-000000000003&sender_id=eq.${item.id}&select=id`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const existing = await checkRes.json();

        if (existing && existing.length > 0) {
          await fetch(`${SUPABASE_URL}/rest/v1/messages?id=eq.${existing[0].id}`, {
            method: 'PATCH',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ content: JSON.stringify(logPayload) })
          });
        } else {
          await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              item_id: '00000000-0000-0000-0000-000000000003',
              sender_id: item.id,
              sender_name: 'TRANSACTION',
              content: JSON.stringify(logPayload)
            })
          });
        }
      } catch(e) {
        console.error('Save transaction log error:', e);
      }
    }

    function renderArchive(logs) {
      const tbody = document.getElementById('archive-table-body');
      if (!tbody) return;

      if (logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-8 text-center text-gray-400 font-bold">尚無成交或下架存檔紀錄</td></tr>`;
        document.getElementById('archive-stat-count').innerText = '0';
        document.getElementById('archive-stat-sum').innerText = 'NT$ 0';
        document.getElementById('archive-stat-free').innerText = '0';
        return;
      }

      // Calculate stats
      let totalCount = logs.length;
      let totalSum = 0;
      let freeCount = 0;

      const html = logs.map(log => {
        const titleSafe = (log.title || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const price = log.type === 'free' ? 0 : parseInt(log.price || '0', 10);
        const nicknameSafe = (log.nickname || '匿名同仁').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        
        // Sum values
        if (log.type === 'free') {
          freeCount++;
        } else {
          totalSum += price;
        }

        const typeBadge = log.type === 'free' ? '<span class="bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded text-[11px]">🎁 送</span>' :
                          log.type === 'buy' ? '<span class="bg-amber-950 text-amber-400 border border-amber-800 px-2 py-0.5 rounded text-[11px]">🔍 買</span>' :
                          '<span class="bg-indigo-950 text-indigo-400 border border-indigo-800 px-2 py-0.5 rounded text-[11px]">💰 賣</span>';

        const priceStr = log.type === 'free' ? '免費送' : `NT$ ${price.toLocaleString()}`;
        const soldDate = log.sold_at ? new Date(log.sold_at).toLocaleString('zh-TW', { hour12: false }) : '未知時間';

        return `
          <tr class="hover:bg-gray-800/40 transition">
            <td class="px-4 py-3 font-bold text-gray-100">${titleSafe}</td>
            <td class="px-3 py-3">${typeBadge}</td>
            <td class="px-3 py-3 font-black text-indigo-400">${priceStr}</td>
            <td class="px-3 py-3 text-gray-400">${nicknameSafe}</td>
            <td class="px-4 py-3 text-gray-400 text-[11px]">${soldDate}</td>
          </tr>
        `;
      }).join('');

      tbody.innerHTML = html;

      // Update statistics elements
      document.getElementById('archive-stat-count').innerText = totalCount;
      document.getElementById('archive-stat-sum').innerText = `NT$ ${totalSum.toLocaleString()}`;
      document.getElementById('archive-stat-free').innerText = freeCount;
    }

    function filterArchive() {
      const search = (document.getElementById('archive-search')?.value || '').toLowerCase().trim();
      if (!search) {
        renderArchive(allArchiveLogs);
        return;
      }

      const filtered = allArchiveLogs.filter(log => {
        const titleMatch = (log.title || '').toLowerCase().includes(search);
        const nicknameMatch = (log.nickname || '').toLowerCase().includes(search);
        const priceMatch = String(log.price || '').includes(search);
        return titleMatch || nicknameMatch || priceMatch;
      });

      renderArchive(filtered);
    }

    function exportArchiveToTxt() {
      if (allArchiveLogs.length === 0) {
        return showNotification('⚠️ 目前沒有任何成交紀錄可以匯出！', 'warning');
      }

      const searchVal = document.getElementById('archive-search')?.value || '';
      let logsToExport = allArchiveLogs;
      if (searchVal) {
        logsToExport = allArchiveLogs.filter(log => {
          const titleMatch = (log.title || '').toLowerCase().includes(searchVal);
          const nicknameMatch = (log.nickname || '').toLowerCase().includes(searchVal);
          const priceMatch = String(log.price || '').includes(searchVal);
          return titleMatch || nicknameMatch || priceMatch;
        });
      }

      let totalSum = 0;
      let freeCount = 0;
      let text = `==================================================\n`;
      text += `    PEGA 二手告示牌 - 歷史成交與下架存檔紀錄\n`;
      text += `    導出時間：${new Date().toLocaleString('zh-TW', { hour12: false })}\n`;
      if (searchVal) {
        text += `    搜尋條件：${searchVal}\n`;
      }
      text += `==================================================\n\n`;

      logsToExport.forEach((log, index) => {
        const typeStr = log.type === 'free' ? '免費送' : log.type === 'buy' ? '想買' : '想賣';
        const price = log.type === 'free' ? 0 : parseInt(log.price || '0', 10);
        
        if (log.type === 'free') {
          freeCount++;
        } else {
          totalSum += price;
        }

        const priceText = log.type === 'free' ? 'NT$ 0 (免費)' : `NT$ ${price.toLocaleString()}`;
        const soldDate = log.sold_at ? new Date(log.sold_at).toLocaleString('zh-TW', { hour12: false }) : '未知時間';
        const createDate = log.created_at ? new Date(log.created_at).toLocaleString('zh-TW', { hour12: false }) : '未知時間';

        text += `${index + 1}. 【${typeStr}】${log.title}\n`;
        text += `   - 交易金額：${priceText}\n`;
        text += `   - 刊登同仁：${log.nickname || '匿名同仁'}\n`;
        text += `   - 上架時間：${createDate}\n`;
        text += `   - 成交時間：${soldDate}\n`;
        text += `   - 商品 ID ：${log.id}\n`;
        text += `--------------------------------------------------\n`;
      });

      text += `\n==================================================\n`;
      text += `【存檔統計摘要】\n`;
      text += `累計存檔總數：${logsToExport.length} 件\n`;
      text += `交易金額總計：NT$ ${totalSum.toLocaleString()} 元\n`;
      text += `免費贈送件數：${freeCount} 件\n`;
      text += `==================================================\n`;

      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `PEGA_secondhand_transactions_${new Date().toISOString().slice(0, 10)}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      showNotification('📥 歷史成交紀錄文字檔已成功下載！', 'success');
    }

                        async function loadAnnouncement() {
      const defaultNotice = '📢【使用須知】歡迎使用 PEGAPEGA 告示牌！1. 本平台免登入即可發布買賣與贈送 2. 請務必填寫真實分機或 LINE 以利聯繫 3. 交易完成請點擊卡片『下架我的貼文』以防騷擾 4. 歡迎同仁善加利用免費贈送專區！';
      const textSpan = document.getElementById('announcement-text');
      const adminInput = document.getElementById('admin-announcement-input');
      const bar = document.getElementById('announcement-bar');

      // 優先讀取本機快取的自訂須知，極速反應
      const cachedNotice = localStorage.getItem('pega_custom_announcement');
      const initialNotice = cachedNotice || defaultNotice;

      if (textSpan) textSpan.innerText = initialNotice;
      if (adminInput && !adminInput.value) adminInput.value = initialNotice;
      if (bar) bar.classList.remove('hidden');

      try {
        const cacheBuster = Date.now();
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?item_id=eq.00000000-0000-0000-0000-000000000001&select=*&order=created_at.desc&limit=1&_t=${cacheBuster}`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.length > 0 && data[0].content) {
            const dbText = data[0].content;
            if (textSpan) textSpan.innerText = dbText;
            if (adminInput) adminInput.value = dbText;
            localStorage.setItem('pega_custom_announcement', dbText);
          }
        }
      } catch(e) { 
        console.error('Fetch notice error:', e); 
      }
    }

        async function saveAnnouncement() {
      const input = document.getElementById('admin-announcement-input');
      const text = (input?.value || '').trim();
      if (!text) return showNotification('請輸入公告內容', 'warning');

      // 1. 即時寫入 localStorage 與前端 DOM 畫面
      localStorage.setItem('pega_custom_announcement', text);
      const textSpan = document.getElementById('announcement-text');
      if (textSpan) textSpan.innerText = text;
      const bar = document.getElementById('announcement-bar');
      if (bar) bar.classList.remove('hidden');

      try {
        // 2. 查詢 Supabase 資料庫已有紀錄
        const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/messages?item_id=eq.00000000-0000-0000-0000-000000000001&select=id`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const existing = await checkRes.json();

        if (existing && existing.length > 0) {
          // 更新所有匹配到的公告紀錄
          for (const item of existing) {
            await fetch(`${SUPABASE_URL}/rest/v1/messages?id=eq.${item.id}`, {
              method: 'PATCH',
              headers: { 
                'apikey': SUPABASE_KEY, 
                'Authorization': `Bearer ${SUPABASE_KEY}`, 
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
              },
              body: JSON.stringify({ content: text })
            });
          }
        } else {
          // 插入新紀錄
          await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
            method: 'POST',
            headers: { 
              'apikey': SUPABASE_KEY, 
              'Authorization': `Bearer ${SUPABASE_KEY}`, 
              'Content-Type': 'application/json',
              'Prefer': 'return=representation'
            },
            body: JSON.stringify({ 
              item_id: '00000000-0000-0000-0000-000000000001', 
              sender_id: 'ADMIN', 
              sender_name: 'ADMIN', 
              content: text 
            })
          });
        }
        showNotification('🎉 全站使用須知已成功寫入雲端資料庫！', 'success');
      } catch(e) { 
        console.error('Save announcement error:', e); 
        showNotification('✅ 須知已於本機生效，雲端連線同步中', 'success');
      }
    }

    async function clearAnnouncement() {
      try {
        const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/messages?item_id=eq.00000000-0000-0000-0000-000000000001&select=id`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const existing = await checkRes.json();
        if (existing && existing.length > 0) {
          for (const item of existing) {
            await fetch(`${SUPABASE_URL}/rest/v1/messages?id=eq.${item.id}`, {
              method: 'DELETE',
              headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
          }
        }
        
        const textSpan = document.getElementById('announcement-text');
        const adminInput = document.getElementById('admin-announcement-input');
        const bar = document.getElementById('announcement-bar');

        if (textSpan) textSpan.innerText = '';
        if (adminInput) adminInput.value = '';
        if (bar) bar.classList.add('hidden');

        showNotification('🗑️ 全站公告已從資料庫與畫面完全清除！', 'info');
      } catch(e) { console.error('Clear announcement error:', e); }
    }

    function closeAnnouncementBar() { document.getElementById('announcement-bar').classList.add('hidden'); }

    
    function switchIssueTab(tab) {
      const formView = document.getElementById('issue-view-form');
      const listView = document.getElementById('issue-view-list');
      const formTabBtn = document.getElementById('issue-tab-form');
      const listTabBtn = document.getElementById('issue-tab-list');

      if (tab === 'form') {
        if (formView) formView.classList.remove('hidden');
        if (listView) listView.classList.add('hidden');
        if (formTabBtn) formTabBtn.className = 'px-4 py-2 rounded-xl bg-amber-600 text-white font-bold text-xs transition shadow flex items-center gap-1.5';
        if (listTabBtn) listTabBtn.className = 'px-4 py-2 rounded-xl bg-gray-800 text-gray-300 hover:text-white border border-gray-700 font-bold text-xs transition flex items-center gap-1.5';
      } else {
        if (formView) formView.classList.add('hidden');
        if (listView) listView.classList.remove('hidden');
        if (formTabBtn) formTabBtn.className = 'px-4 py-2 rounded-xl bg-gray-800 text-gray-300 hover:text-white border border-gray-700 font-bold text-xs transition flex items-center gap-1.5';
        if (listTabBtn) listTabBtn.className = 'px-4 py-2 rounded-xl bg-amber-600 text-white font-bold text-xs transition shadow flex items-center gap-1.5';
        loadAndRenderIssues();
      }
    }

        async function toggleResolveIssue(issueId, isCurrentlyResolved) {
      if (!isAdmin) return showNotification('⚠️ 只有版主可以變更處理狀態', 'warning');
      
      try {
        // Fetch original content
        const fetchRes = await fetch(`${SUPABASE_URL}/rest/v1/messages?id=eq.${issueId}&select=content`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const msgData = await fetchRes.json();
        if (!msgData || msgData.length === 0) return;

        let content = msgData[0].content || '';
        if (isCurrentlyResolved) {
          content = content.replace(/\[RESOLVED\]/g, '').trim();
        } else {
          content = `${content.replace(/\[RESOLVED\]/g, '').trim()}\n[RESOLVED]`;
        }

        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?id=eq.${issueId}`, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ content: content })
        });

        if (res.ok) {
          showNotification(!isCurrentlyResolved ? '✅ 已標記為【已修復/已開發完成】並自動沉底！' : '⚡ 已標記為處理中', 'success');
          loadAndRenderIssues();
        }
      } catch(e) {
        console.error('Resolve issue error:', e);
      }
    }

    async function deleteIssueAdmin(issueId) {
      if (!isAdmin) return;
      if (!confirm('確定要刪除這筆留言紀錄嗎？')) return;
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/messages?id=eq.${issueId}`, {
          method: 'DELETE',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        showNotification('🗑️ 留言紀錄已刪除', 'info');
        loadAndRenderIssues();
      } catch(e) {
        console.error('Delete issue error:', e);
      }
    }

    function openIssueModal() {
      document.getElementById('issue-modal').classList.remove('hidden');
      loadAndRenderIssues();
    }

    function closeIssueModal() { document.getElementById('issue-modal').classList.add('hidden'); }

            async function loadAndRenderIssues() {
      const container = document.getElementById('issue-list-container');
      const badge = document.getElementById('issue-count-badge');
      if (!container) return;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?item_id=eq.00000000-0000-0000-0000-000000000002&order=created_at.desc`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });

        if (res.ok) {
          const issues = await res.json();
          if (badge) badge.innerText = issues.length;

          if (issues.length === 0) {
            container.innerHTML = '<p class="text-gray-500 text-center py-10 text-xs">💬 尚無任何留言歷史紀錄</p>';
            return;
          }

          // 處理中排在前面，已修復([RESOLVED]) 沉底在最後面
          issues.sort((a, b) => {
            const aResolved = (a.content || '').includes('[RESOLVED]') ? 1 : 0;
            const bResolved = (b.content || '').includes('[RESOLVED]') ? 1 : 0;
            return aResolved - bResolved;
          });

          container.innerHTML = issues.map(iss => {
            const isResolved = (iss.content || '').includes('[RESOLVED]');
            const rawContent = (iss.content || '').replace(/\[RESOLVED\]/g, '').trim();
            const safeContent = rawContent.replace(/</g, "&lt;").replace(/>/g, "&gt;");

            return `
              <div class="p-3.5 ${isResolved ? 'bg-gray-950/60 opacity-70 border-gray-800/60' : 'bg-gray-900 border-gray-700/80'} border rounded-2xl space-y-2 transition">
                <div class="flex items-center justify-between text-[11px]">
                  <span class="font-bold text-gray-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-user text-amber-400"></i> ${iss.sender_name || '熱心同仁'} 
                    ${isResolved ? 
                      '<span class="bg-emerald-950/80 text-emerald-400 border border-emerald-500/40 text-[10px] font-bold px-2 py-0.5 rounded-md">✅ 已修復 / 已開發完成 (已沉底)</span>' : 
                      '<span class="bg-amber-950/80 text-amber-400 border border-amber-500/40 text-[10px] font-bold px-2 py-0.5 rounded-md animate-pulse">⚡ 處理中 / 待版主回覆</span>'}
                  </span>
                  <span class="text-[10px] text-gray-500">${timeAgo(iss.created_at)}</span>
                </div>

                <div class="text-xs text-gray-200 leading-relaxed font-medium bg-black/30 p-3 rounded-xl border border-white/5 whitespace-pre-line">
                  ${safeContent}
                </div>

                ${isAdmin ? `
                  <div class="flex justify-end gap-1.5 pt-1">
                    <button onclick="toggleResolveIssue('${iss.id}', ${isResolved})" class="px-2.5 py-1 ${isResolved ? 'bg-amber-900/60 text-amber-300' : 'bg-emerald-900/60 text-emerald-300'} text-[10px] font-bold rounded-lg transition">
                      ${isResolved ? '↩️ 恢復為處理中' : '✅ 標記為已修復 (沉底)'}
                    </button>
                    <button onclick="deleteIssueAdmin('${iss.id}')" class="px-2 py-1 bg-red-900/60 text-red-300 text-[10px] font-bold rounded-lg transition">
                      🗑️ 刪除留言
                    </button>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('');
        }
      } catch(e) {
        console.error('Load issues error:', e);
      }
    }

            async function submitNewIssue() {
      const errBox = document.getElementById('issue-form-error');
      const errText = document.getElementById('issue-form-error-text');
      const submitBtn = document.getElementById('submit-issue-btn');
      if (errBox) errBox.classList.add('hidden');

      const content = (document.getElementById('issue-content')?.value || '').trim();
      if (!content) {
        if (errBox && errText) {
          errText.innerText = '⚠️ 請填寫問題或建議內容！';
          errBox.classList.remove('hidden');
        }
        showNotification('⚠️ 請輸入問題或建議內容', 'warning');
        return;
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 送出中...';
      }

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            item_id: '00000000-0000-0000-0000-000000000002',
            sender_id: deviceId,
            sender_name: nickname,
            content: content
          })
        });

        if (res.ok) {
          showNotification('🎉 已收到您的問題單，感謝寶貴建議！', 'success');
          document.getElementById('issue-content').value = '';
          switchIssueTab('list');
        } else {
          const errData = await res.text();
          if (errBox && errText) {
            errText.innerText = '⚠️ 送出失敗：' + (errData || '連線異常');
            errBox.classList.remove('hidden');
          }
          showNotification('⚠️ 送出失敗，請檢查連線', 'warning');
        }
      } catch(e) {
        console.error('Submit issue error:', e);
        if (errBox && errText) {
          errText.innerText = '⚠️ 送出發生錯誤：' + e.message;
          errBox.classList.remove('hidden');
        }
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 送出問題單';
        }
      }
    }

    // 初始載入
    updateIdentityDisplay();
    loadSiteName();
    loadAnnouncement();
    
    // Apply saved grid columns
    const initialCols = localStorage.getItem('pega_grid_cols') || (window.innerWidth < 640 ? '1' : '4');
    const gridSelect = document.getElementById('grid-layout-select');
    if (gridSelect) gridSelect.value = initialCols;
    applyGridLayout(initialCols);

    loadItems();
  </script>
