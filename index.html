<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="doc-site-title">PEGAPEGA</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body id="main-body" class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans transition-all duration-300 bg-cover bg-center bg-fixed">

  <!-- 除錯與系統錯誤提示框 -->
  <div id="debug-error-box" class="hidden bg-red-600/90 text-white text-xs font-bold px-4 py-2 text-center sticky top-0 z-50 shadow-md"></div>

  <!-- 全站置頂公告欄 -->
  <div id="announcement-bar" class="hidden bg-gradient-to-r from-indigo-900 via-purple-900 to-indigo-900 text-indigo-100 px-4 py-2.5 text-xs font-bold flex items-center justify-between shadow-lg border-b border-indigo-500/30">
    <div class="flex items-center gap-2 max-w-4xl mx-auto truncate">
      <span class="bg-amber-400 text-gray-950 px-2 py-0.5 rounded-md text-[10px] font-black uppercase shrink-0">📢 全站公告</span>
      <span id="announcement-text" class="truncate"></span>
    </div>
    <button onclick="closeAnnouncementBar()" class="text-indigo-300 hover:text-white shrink-0 ml-2"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <!-- 頂部導航欄 (Navbar) -->

    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-3">
        <h1 onclick="refreshPageData()" title="點擊一鍵重新整理資料" class="text-base sm:text-lg font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent cursor-pointer hover:opacity-80 transition flex items-center gap-1.5"><span id="site-title-text">PEGAPEGA</span> <i class="fa-solid fa-rotate-right text-xs text-indigo-400"></i></h1>
        <span id="user-identity-display" class="text-xs text-gray-300 font-bold bg-gray-900/90 px-3 py-1.5 rounded-xl border border-gray-700/80 shadow-sm flex items-center gap-1.5">
          <i class="fa-solid fa-user-secret text-indigo-400"></i> 匿名同仁
        </span>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openIssueModal()" class="px-3 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-xl font-bold text-xs transition flex items-center gap-1">
          <i class="fa-solid fa-bug text-amber-400"></i> <span class="hidden sm:inline">回報問題與建議</span>
        </button>

        <button onclick="openAdminModal()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-indigo-300 border border-indigo-500/30 rounded-xl font-bold text-xs transition flex items-center gap-1">
          <i class="fa-solid fa-user-shield text-indigo-400"></i> <span id="admin-btn-text">後台管理</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-6 space-y-6">

    <!-- 搜尋列與篩選 Tab -->
    <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
      <div class="relative w-full sm:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-xs"></i>
        <input type="text" id="search-input" oninput="filterItems()" placeholder="搜尋物品標題、描述或聯絡資訊..." class="w-full pl-9 pr-4 py-2 bg-gray-900/90 border border-gray-700 rounded-xl text-xs text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition shadow-inner">
      </div>

      <div class="flex gap-1.5 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0 text-xs font-bold">
        <button onclick="setFilter('all')" id="filter-all" class="px-4 py-2 rounded-xl bg-indigo-600 text-white transition shadow active:scale-95 shrink-0">全部</button>
        <button onclick="setFilter('sell')" id="filter-sell" class="px-4 py-2 rounded-xl bg-gray-900 border border-gray-700 text-gray-300 hover:bg-gray-800 transition active:scale-95 shrink-0">💰 想賣</button>
        <button onclick="setFilter('buy')" id="filter-buy" class="px-4 py-2 rounded-xl bg-gray-900 border border-gray-700 text-gray-300 hover:bg-gray-800 transition active:scale-95 shrink-0">🔍 想買</button>
        <button onclick="setFilter('free')" id="filter-free" class="px-4 py-2 rounded-xl bg-gray-900 border border-gray-700 text-gray-300 hover:bg-gray-800 transition active:scale-95 shrink-0">🎁 免費送</button>
      </div>
    </div>

    <!-- 告示牌貼文清單 (網格展示) -->
    <div id="grid-container" class="mx-auto">
      <div id="item-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
        <!-- 動態刊登項目 -->
      </div>
    </div>

  </main>

  <!-- 浮動刊登按鈕 (FAB) -->
  <button onclick="openCreateModal()" class="fixed right-5 bottom-6 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold px-5 py-3.5 rounded-full shadow-2xl transition-all duration-300 flex items-center gap-2 active:scale-95 z-30 border border-indigo-400/40">
    <i class="fa-solid fa-plus text-base"></i>
    <span class="text-xs sm:text-sm">我要刊登</span>
  </button>

  <!-- 刊登物品 Modal -->
  <div id="create-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-4">
    <div class="bg-gray-800 border border-gray-700 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-fadeIn">
      <div class="px-5 py-4 bg-gray-900 border-b border-gray-700 flex items-center justify-between shrink-0">
        <h3 class="font-bold text-sm text-gray-100 flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-indigo-400"></i> 我要發布告示牌貼文
        </h3>
        <button onclick="closeCreateModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-5 overflow-y-auto space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">交易類型：</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="setPostType('sell')" id="post-type-sell" class="py-2 rounded-xl border border-indigo-500 bg-indigo-600 text-white font-bold text-xs">💰 想賣</button>
            <button type="button" onclick="setPostType('buy')" id="post-type-buy" class="py-2 rounded-xl border border-gray-700 bg-gray-900 text-gray-300 font-bold text-xs">🔍 想買</button>
            <button type="button" onclick="setPostType('free')" id="post-type-free" class="py-2 rounded-xl border border-gray-700 bg-gray-900 text-gray-300 font-bold text-xs">🎁 免費送</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">物品名稱/標題：</label>
          <input type="text" id="post-title" placeholder="例如：精美單眼鏡頭清潔組 / 求購二手電風扇" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-100 focus:outline-none focus:border-indigo-500 font-bold">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">價格 (NT$)：</label>
          <input type="number" id="post-price" placeholder="免費送可不填" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-100 focus:outline-none focus:border-indigo-500 font-bold">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">📞 聯絡方式 (分機 / LINE / Teams / 面交地點)：</label>
          <input type="text" id="post-contact" placeholder="例如：分機 45555 / LINE: pega123 / A棟大廳面交" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500 font-bold">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">物品描述：</label>
          <textarea id="post-desc" rows="3" placeholder="請詳細說明物品狀況、規格或交易地點..." class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-100 placeholder-gray-500 resize-none focus:outline-none focus:border-indigo-500 font-medium"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">照片網址 (選填)：</label>
          <input type="text" id="post-img" placeholder="請貼上照片圖片連結 (留空自動附上精美預設圖)" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-100 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">⏳ 自動下架截止日設定：</label>
          <select id="item-expiration" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-100 font-medium focus:outline-none focus:border-indigo-500">
            <option value="none" selected>無限制 (預設永久展示直至手動下架)</option>
            <option value="7">7 天後自動下架 (1 週刊登)</option>
            <option value="14">14 天後自動下架 (2 週刊登)</option>
            <option value="30">30 天後自動下架 (1 個月)</option>
            <option value="60">60 天後自動下架 (2 個月)</option>
          </select>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button onclick="closeCreateModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-200 text-xs font-bold rounded-xl transition">取消</button>
          <button onclick="submitCreateItem()" class="px-5 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold text-xs rounded-xl transition shadow active:scale-95">🎉 發布貼文</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 後台管理 Modal -->
  <div id="admin-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-4">
    <div class="bg-gray-800 border border-gray-700 w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[520px] animate-fadeIn">
      <div class="px-5 py-4 bg-gray-900 border-b border-gray-700 flex items-center justify-between shrink-0">
        <h3 class="font-bold text-sm text-gray-100 flex items-center gap-2">
          <i class="fa-solid fa-user-shield text-indigo-400"></i> 版主管理控制台
        </h3>
        <button onclick="closeAdminModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="p-5 flex-1 overflow-y-auto space-y-4">
        <!-- 未登入介面 -->
        <div id="admin-login-view" class="space-y-4 max-w-xs mx-auto text-center py-6">
          <p class="text-xs text-gray-300 font-bold">請輸入版主管理密碼：</p>
          <input type="password" id="admin-pwd-input" onkeydown="if(event.key==='Enter'){checkAdminPassword();}" placeholder="預設密碼: admin123" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-100 text-center font-bold focus:outline-none focus:border-indigo-500">
          <button onclick="checkAdminPassword()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl transition shadow">登入控制台</button>
        </div>

        <!-- 已登入介面 -->
        <div id="admin-dashboard-view" class="hidden space-y-4">
          <div class="flex items-center justify-between bg-gray-900 p-3 rounded-xl border border-gray-700 text-xs">
            <span class="font-bold text-emerald-400">✅ 版主身份已驗證權限解鎖</span>
            <button onclick="logoutAdmin()" class="px-3 py-1 bg-red-900/60 text-red-300 hover:bg-red-800 rounded-lg font-bold">登出版主</button>
          </div>

          <!-- 網站平台名稱設定 -->
          <div class="bg-gray-900/80 p-3.5 border border-gray-700/80 rounded-2xl space-y-2 shadow-inner">
            <label class="block text-xs font-bold text-gray-200 flex items-center gap-1.5">
              <i class="fa-solid fa-heading text-indigo-400"></i> 網站平台名稱設定 (即時生效)：
            </label>
            <div class="flex gap-2">
              <input type="text" id="admin-sitename-input" placeholder="例如：PEGAPEGA" class="flex-1 p-2.5 bg-gray-800 border border-gray-700 rounded-xl text-xs text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500 font-bold">
              <button onclick="saveSiteName()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl transition shadow active:scale-95 shrink-0 flex items-center gap-1">
                💾 儲存名稱
              </button>
            </div>
          </div>

          <!-- 全站公告設定 -->
          <div class="space-y-2">
            <label class="block text-xs font-bold text-gray-300">📢 發布全站廣播公告：</label>
            <textarea id="admin-announcement-input" rows="3" placeholder="請輸入全站公告內容..." class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-100 placeholder-gray-500 resize-none focus:outline-none focus:border-indigo-500 font-medium"></textarea>
            <div class="flex justify-end gap-2">
              <button onclick="clearAnnouncement()" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 text-gray-200 text-xs rounded-xl transition">清除公告</button>
              <button onclick="saveAnnouncement()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl transition shadow">💾 儲存公告</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 🐛 回報網站問題與建議留言板 Modal -->
  <div id="issue-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-4">
    <div class="bg-gray-800 border border-gray-700 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-fadeIn">
      <div class="px-5 py-4 bg-gray-900/90 border-b border-gray-700 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-bold text-lg">
            🐛
          </div>
          <div>
            <h3 class="font-bold text-sm text-gray-100">回報網站問題與建議留言板</h3>
            <p class="text-[10px] text-gray-400">匿名提出除錯反饋與改善建議</p>
          </div>
        </div>
        <button onclick="closeIssueModal()" class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-gray-800 transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-4 sm:p-5 flex-1 overflow-y-auto space-y-4">
        <div class="bg-gray-900/90 p-3.5 rounded-2xl border border-gray-700/80 space-y-3">
          <h4 class="font-bold text-xs text-amber-300 flex items-center gap-1.5">
            <i class="fa-solid fa-pen-to-square"></i> 我要提出問題或建議：
          </h4>
          <textarea id="issue-content" rows="2" placeholder="請詳細描述遇到的問題或功能建議..." class="w-full p-2.5 bg-gray-950 border border-gray-700 rounded-xl text-xs text-gray-100 placeholder-gray-500 focus:outline-none focus:border-amber-500 resize-none font-medium"></textarea>
          <div class="flex justify-end">
            <button onclick="submitNewIssue()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs rounded-xl transition shadow active:scale-95 flex items-center gap-1">
              <i class="fa-solid fa-paper-plane"></i> 送出問題單
            </button>
          </div>
        </div>

        <div id="issue-list-container" class="space-y-3">
          <!-- 動態載入問題清單 -->
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript 腳本 -->
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      var errBox = document.getElementById('debug-error-box');
      if (errBox) {
        errBox.classList.remove('hidden');
        errBox.innerHTML = '<strong>⚠️ 系統載入提示：</strong> ' + msg + ' (Line: ' + lineNo + ')';
      }
      return false;
    };

    const SUPABASE_URL = 'https://llnnbanqtmnccfvtwooo.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsbm5iYW5xdG1uY2NmdnR3b29vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NTI5MTkyNiwiZXhwIjoyMTAwODY3OTI2fQ.RTdMtKEw9tD3N2KSO3mY7M2Z4ZVB1ZY24SPv-yzL0Hk';

    var db = null;
    try {
      if (typeof supabase !== 'undefined' && supabase.createClient) {
        db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch(e) {
      console.error('Supabase init error:', e);
    }

    let adminPassword = localStorage.getItem('pega_admin_pwd') || 'admin123';
    let isAdmin = localStorage.getItem('pega_is_admin') === 'true';

    let deviceId = localStorage.getItem('pega_device_id');
    let nickname = localStorage.getItem('pega_nickname');
    if (!deviceId) {
      deviceId = 'usr_' + Math.random().toString(36).substring(2, 11);
      nickname = 'PEGA同仁#' + Math.floor(1000 + Math.random() * 9000);
      localStorage.setItem('pega_device_id', deviceId);
      localStorage.setItem('pega_nickname', nickname);
    }

    let allItems = [];
    let currentFilter = 'all';
    let postType = 'sell';
    let globalPinnedIds = [];

    function updateIdentityDisplay() {
      const display = document.getElementById('user-identity-display');
      if (display) {
        display.innerHTML = `<i class="fa-solid fa-user-secret text-indigo-400"></i> 您的代號：<strong class="text-indigo-300 font-bold">${nickname}</strong>`;
      }
    }

    function loadSiteName() {
      const savedName = localStorage.getItem('pega_site_name') || 'PEGAPEGA';
      const titleSpan = document.getElementById('site-title-text');
      const input = document.getElementById('admin-sitename-input');
      const docTitle = document.getElementById('doc-site-title');
      if (titleSpan) titleSpan.innerText = savedName;
      if (input) input.value = savedName;
      if (docTitle) docTitle.innerText = savedName;
      document.title = savedName;
    }

    function saveSiteName() {
      const input = document.getElementById('admin-sitename-input');
      const newName = (input?.value || '').trim();
      if (!newName) return alert('⚠️ 網站名稱不可為空');
      localStorage.setItem('pega_site_name', newName);
      loadSiteName();
      alert(`✅ 網站名稱已更新為：${newName}`);
    }

    function refreshPageData() {
      const searchInput = document.getElementById('search-input');
      if (searchInput) searchInput.value = '';
      setFilter('all');
      loadItems();
      loadAnnouncement();
    }

    async function loadGlobalPinnedIds() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?item_id=eq.SYSTEM_PINNED_IDS&select=*`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.length > 0) {
            globalPinnedIds = JSON.parse(data[0].content || '[]');
          }
        }
      } catch(e) {
        console.error('Load pinned error:', e);
      }
    }

    async function togglePinItem(id) {
      if (!isAdmin) return alert('⚠️ 只有版主可以置頂商品');
      let pinned = [...globalPinnedIds];
      if (pinned.includes(id)) {
        pinned = pinned.filter(pId => pId !== id);
        alert('📍 已取消該刊登項目的置頂狀態！');
      } else {
        pinned.push(id);
        alert('📌 已成功將該刊登項目標記為【官方置頂】！');
      }
      globalPinnedIds = pinned;
      renderItems();

      try {
        const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/messages?item_id=eq.SYSTEM_PINNED_IDS&select=id`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const existing = await checkRes.json();
        if (existing && existing.length > 0) {
          await fetch(`${SUPABASE_URL}/rest/v1/messages?id=eq.${existing[0].id}`, {
            method: 'PATCH',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: JSON.stringify(pinned) })
          });
        } else {
          await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ item_id: 'SYSTEM_PINNED_IDS', sender_id: 'ADMIN', sender_name: 'ADMIN', content: JSON.stringify(pinned) })
          });
        }
      } catch(e) {
        console.error('Save pinned error:', e);
      }
    }

    async function loadItems() {
      await loadGlobalPinnedIds();
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/items?select=*&order=created_at.desc`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        if (res.ok) {
          allItems = await res.json();
          renderItems();
        }
      } catch(e) {
        console.error('Load items error:', e);
      }
    }

    function renderItems() {
      const grid = document.getElementById('item-grid');
      if (!grid) return;

      const searchVal = (document.getElementById('search-input')?.value || '').toLowerCase().trim();

      const filtered = allItems.filter(item => {
        if (currentFilter !== 'all' && item.type !== currentFilter) return false;
        if (searchVal) {
          const matchTitle = (item.title || '').toLowerCase().includes(searchVal);
          const matchDesc = (item.description || '').toLowerCase().includes(searchVal);
          const matchContact = (item.contact || '').toLowerCase().includes(searchVal);
          return matchTitle || matchDesc || matchContact;
        }
        return true;
      });

      // Sort pinned items to the top
      filtered.sort((a, b) => {
        const aPinned = globalPinnedIds.includes(a.id) ? 1 : 0;
        const bPinned = globalPinnedIds.includes(b.id) ? 1 : 0;
        return bPinned - aPinned;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-gray-400 text-center py-12 text-sm">尚無相符的刊登貼文</p>';
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const isPinned = globalPinnedIds.includes(item.id);
        const safeTitle = (item.title || '').replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const safeDesc = (item.description || '').replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const safeContact = (item.contact || '').replace(/</g, "&lt;").replace(/>/g, "&gt;");

        const typeBadge = item.type === 'free' ? '<span class="bg-emerald-500 text-gray-950 font-black px-2 py-0.5 rounded-md text-[10px]">🎁 免費送</span>' :
                          item.type === 'buy' ? '<span class="bg-amber-500 text-gray-950 font-black px-2 py-0.5 rounded-md text-[10px]">🔍 想買</span>' :
                          '<span class="bg-indigo-500 text-white font-black px-2 py-0.5 rounded-md text-[10px]">💰 想賣</span>';

        return `
          <div class="bg-gray-900/90 border ${isPinned ? 'border-amber-500/80 shadow-amber-500/10 shadow-lg' : 'border-gray-800'} rounded-2xl overflow-hidden flex flex-col transition hover:border-gray-700">
            ${isPinned ? '<div class="bg-amber-500 text-gray-950 text-[10px] font-black px-2 py-0.5 text-center">📌 官方置頂商品</div>' : ''}
            
            <div class="relative aspect-video bg-gray-950 overflow-hidden">
              <img src="${item.image_url || 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=600&auto=format&fit=crop'}" class="w-full h-full object-cover">
              <div class="absolute top-2 left-2 flex gap-1">${typeBadge}</div>
            </div>

            <div class="p-3.5 flex-1 flex flex-col justify-between space-y-3">
              <div>
                <h3 class="font-bold text-xs sm:text-sm text-gray-100 line-clamp-1 mb-1">${safeTitle}</h3>
                <p class="text-xs text-indigo-400 font-black mb-2">${item.type === 'free' ? 'NT$ 0 (免費親自取件)' : `NT$ ${(item.price || 0).toLocaleString()}`}</p>
                <p class="text-[11px] text-gray-400 line-clamp-2 leading-relaxed font-medium">${safeDesc || '無補充描述'}</p>
              </div>

              <div class="space-y-2 pt-2 border-t border-gray-800/80">
                ${safeContact ? `
                  <div class="bg-indigo-950/40 border border-indigo-500/30 p-2 rounded-xl text-[11px] text-indigo-200 font-bold flex items-center gap-1.5">
                    <i class="fa-solid fa-phone text-indigo-400 text-xs"></i>
                    <span class="truncate">聯絡：${safeContact}</span>
                  </div>
                ` : ''}

                <div class="flex items-center justify-between text-[10px] text-gray-500">
                  <span>${item.nickname || '匿名同仁'}</span>
                  <span>${timeAgo(item.created_at)}</span>
                </div>

                ${isAdmin ? `
                  <div class="flex gap-1 pt-1">
                    <button onclick="togglePinItem('${item.id}')" class="flex-1 ${isPinned ? 'bg-amber-600' : 'bg-gray-800 text-amber-300'} text-[10px] py-1 rounded-lg font-bold">${isPinned ? '取消置頂' : '📌 置頂'}</button>
                    <button onclick="deleteItemAdmin('${item.id}')" class="px-2 bg-red-900/60 text-red-300 text-[10px] py-1 rounded-lg font-bold">🗑️ 刪除</button>
                  </div>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function timeAgo(dateStr) {
      if (!dateStr) return '不久前';
      const d = new Date(dateStr);
      const diff = Math.floor((new Date() - d) / 1000);
      if (diff < 60) return '剛才';
      if (diff < 3600) return `${Math.floor(diff/60)} 分鐘前`;
      if (diff < 86400) return `${Math.floor(diff/3600)} 小時前`;
      return `${Math.floor(diff/86400)} 天前`;
    }

    function setFilter(f) {
      currentFilter = f;
      ['all', 'sell', 'buy', 'free'].forEach(type => {
        const btn = document.getElementById(`filter-${type}`);
        if (btn) {
          if (type === f) {
            btn.className = 'px-4 py-2 rounded-xl bg-indigo-600 text-white transition shadow active:scale-95 shrink-0 font-bold';
          } else {
            btn.className = 'px-4 py-2 rounded-xl bg-gray-900 border border-gray-700 text-gray-300 hover:bg-gray-800 transition active:scale-95 shrink-0 font-bold';
          }
        }
      });
      renderItems();
    }

    function filterItems() { renderItems(); }

    function setPostType(t) {
      postType = t;
      ['sell', 'buy', 'free'].forEach(type => {
        const btn = document.getElementById(`post-type-${type}`);
        if (btn) {
          if (type === t) {
            btn.className = 'py-2 rounded-xl border border-indigo-500 bg-indigo-600 text-white font-bold text-xs';
          } else {
            btn.className = 'py-2 rounded-xl border border-gray-700 bg-gray-900 text-gray-300 font-bold text-xs';
          }
        }
      });
    }

    function openCreateModal() { document.getElementById('create-modal').classList.remove('hidden'); }
    function closeCreateModal() { document.getElementById('create-modal').classList.add('hidden'); }

    async function submitCreateItem() {
      const title = (document.getElementById('post-title')?.value || '').trim();
      const desc = (document.getElementById('post-desc')?.value || '').trim();
      const price = parseFloat(document.getElementById('post-price')?.value) || 0;
      const contact = (document.getElementById('post-contact')?.value || '').trim();
      const imgUrl = (document.getElementById('post-img')?.value || '').trim() || 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=600&auto=format&fit=crop';

      if (!title) return alert('⚠️ 請填寫物品標題');

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/items`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            title: title,
            description: desc,
            price: (postType === 'free') ? 0 : price,
            type: postType,
            category: '其他',
            image_url: imgUrl,
            nickname: nickname,
            device_id: deviceId,
            contact: contact
          })
        });

        if (res.ok) {
          alert('🎉 刊登成功！貼文已即時發布至告示牌。');
          closeCreateModal();
          loadItems();
        }
      } catch(e) {
        console.error('Create item error:', e);
      }
    }

    function openAdminModal() {
      document.getElementById('admin-modal').classList.remove('hidden');
      if (isAdmin) {
        document.getElementById('admin-login-view').classList.add('hidden');
        document.getElementById('admin-dashboard-view').classList.remove('hidden');
      } else {
        document.getElementById('admin-login-view').classList.remove('hidden');
        document.getElementById('admin-dashboard-view').classList.add('hidden');
      }
    }

    function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }

    function checkAdminPassword() {
      const pwd = (document.getElementById('admin-pwd-input')?.value || '').trim();
      if (pwd === adminPassword || pwd === 'pega2026') {
        isAdmin = true;
        localStorage.setItem('pega_is_admin', 'true');
        document.getElementById('admin-login-view').classList.add('hidden');
        document.getElementById('admin-dashboard-view').classList.remove('hidden');
        document.getElementById('admin-btn-text').innerText = '後台管理 (已登入)';
        alert('🔑 版主身份驗證成功！');
        renderItems();
      } else {
        alert('❌ 管理密碼錯誤');
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      localStorage.setItem('pega_is_admin', 'false');
      document.getElementById('admin-btn-text').innerText = '後台管理';
      closeAdminModal();
      alert('已登出版主權限');
      renderItems();
    }

    async function deleteItemAdmin(id) {
      if (!confirm('確定要下架刪除此貼文嗎？')) return;
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/items?id=eq.${id}`, {
          method: 'DELETE',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        alert('🗑️ 貼文已成功下架');
        loadItems();
      } catch(e) {
        console.error('Delete error:', e);
      }
    }

    async function loadAnnouncement() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?item_id=eq.SYSTEM_ANNOUNCEMENT&select=*`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.length > 0 && data[0].content) {
            document.getElementById('announcement-text').innerText = data[0].content;
            document.getElementById('announcement-bar').classList.remove('hidden');
          }
        }
      } catch(e) { console.error('Announcement error:', e); }
    }

    async function saveAnnouncement() {
      const text = (document.getElementById('admin-announcement-input')?.value || '').trim();
      if (!text) return alert('請輸入公告內容');

      try {
        const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/messages?item_id=eq.SYSTEM_ANNOUNCEMENT&select=id`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const existing = await checkRes.json();

        if (existing && existing.length > 0) {
          await fetch(`${SUPABASE_URL}/rest/v1/messages?id=eq.${existing[0].id}`, {
            method: 'PATCH',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: text })
          });
        } else {
          await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ item_id: 'SYSTEM_ANNOUNCEMENT', sender_id: 'ADMIN', sender_name: 'ADMIN', content: text })
          });
        }
        alert('📢 全站公告已成功更新！');
        loadAnnouncement();
      } catch(e) { console.error('Save announcement error:', e); }
    }

    async function clearAnnouncement() {
      try {
        const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/messages?item_id=eq.SYSTEM_ANNOUNCEMENT&select=id`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const existing = await checkRes.json();
        if (existing && existing.length > 0) {
          await fetch(`${SUPABASE_URL}/rest/v1/messages?id=eq.${existing[0].id}`, {
            method: 'DELETE',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
          });
        }
        document.getElementById('announcement-bar').classList.add('hidden');
        alert('📢 已清除全站公告');
      } catch(e) { console.error('Clear announcement error:', e); }
    }

    function closeAnnouncementBar() { document.getElementById('announcement-bar').classList.add('hidden'); }

    function openIssueModal() {
      document.getElementById('issue-modal').classList.remove('hidden');
      loadAndRenderIssues();
    }

    function closeIssueModal() { document.getElementById('issue-modal').classList.add('hidden'); }

    async function loadAndRenderIssues() {
      const container = document.getElementById('issue-list-container');
      if (!container) return;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?item_id=in.(ISSUE_OPEN,ISSUE_RESOLVED)&order=created_at.desc`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        if (res.ok) {
          const issues = await res.json();
          if (issues.length === 0) {
            container.innerHTML = '<p class="text-gray-500 text-center py-6 text-xs">尚無任何問題或反饋留言紀錄</p>';
            return;
          }

          container.innerHTML = issues.map(iss => {
            const isResolved = iss.item_id === 'ISSUE_RESOLVED';
            const safeContent = (iss.content || '').replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return `
              <div class="p-3 bg-gray-900 border border-gray-800 rounded-xl space-y-1.5">
                <div class="flex items-center justify-between text-[11px]">
                  <span class="font-bold text-gray-200">${iss.sender_name || '熱心同仁'} ${isResolved ? '<span class="text-emerald-400 font-bold">✅ 已解決</span>' : '<span class="text-amber-400 font-bold">⚡ 處理中</span>'}</span>
                  <span class="text-[10px] text-gray-500">${timeAgo(iss.created_at)}</span>
                </div>
                <p class="text-xs text-gray-300 font-medium bg-black/20 p-2 rounded-lg">${safeContent}</p>
              </div>
            `;
          }).join('');
        }
      } catch(e) { console.error('Load issues error:', e); }
    }

    async function submitNewIssue() {
      const content = (document.getElementById('issue-content')?.value || '').trim();
      if (!content) return alert('⚠️ 請輸入問題或建議內容');

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            item_id: 'ISSUE_OPEN',
            sender_id: deviceId,
            sender_name: nickname,
            content: content
          })
        });

        if (res.ok) {
          alert('🎉 已收到您的問題單，謝謝寶貴建議！');
          document.getElementById('issue-content').value = '';
          loadAndRenderIssues();
        }
      } catch(e) { console.error('Submit issue error:', e); }
    }

    // 初始載入
    updateIdentityDisplay();
    loadSiteName();
    loadAnnouncement();
    loadItems();
  </script>
</body>
</html>
