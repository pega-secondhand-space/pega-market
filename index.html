<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title id="doc-site-title">PEGAPEGA</title>
  
  <!-- 錯誤捕獲機制 -->
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      var errBox = document.getElementById('debug-error-box');
      if (errBox) {
        errBox.classList.remove('hidden');
        errBox.innerHTML = '<strong>⚠️ 系統載入提示：</strong> ' + msg + ' (Line: ' + lineNo + ')';
      }
      return false;
    };
  </script>

  <!-- CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #111827;
      color: #f3f4f6;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      transition: background-image 0.5s ease-in-out;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body id="main-body" class="bg-gray-900 text-gray-100 min-h-screen pb-24 font-sans">

  <!-- Tailwind Safelist -->
  <div class="hidden grid-cols-1 grid-cols-2 grid-cols-3 grid-cols-4 grid-cols-5 max-w-xs max-w-xl max-w-3xl max-w-5xl max-w-7xl bg-blue-600 bg-blue-500 border-blue-400"></div>

  <!-- 除錯與錯誤通報列 -->
  <div id="debug-error-box" class="hidden bg-red-900/90 border-b border-red-500 text-red-100 p-3 text-xs text-center sticky top-0 z-50 shadow-md"></div>

  <!-- 頂部導覽列 -->
  <header class="bg-gray-800/85 backdrop-blur-md border-b border-gray-700/80 p-4 sticky top-0 z-20 shadow-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center px-2">
      <div>
        <h1 onclick="refreshPageData()" title="點擊一鍵重新整理資料" class="text-base sm:text-lg font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent cursor-pointer hover:opacity-80 transition flex items-center gap-1.5"><span id="site-title-text">PEGAPEGA</span> <i class="fa-solid fa-rotate-right text-xs text-indigo-400"></i></h1>
        <p id="user-display" class="text-[11px] text-gray-400 mt-0.5">載入使用者身分中...</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openAdminModal()" class="text-xs bg-indigo-600/80 hover:bg-indigo-600 text-white px-3.5 py-2 rounded-full border border-indigo-500/50 transition flex items-center gap-1.5 shadow font-bold">
          <i class="fa-solid fa-user-shield"></i> <span id="admin-btn-text">後台管理</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區域 -->
  <main class="max-w-7xl mx-auto p-3 sm:p-5 space-y-4">

    <!-- 告示板 (公告欄) -->
    <div id="announcement-bar" class="hidden bg-amber-500/10 border border-amber-500/30 text-amber-300 px-4 py-3 rounded-xl text-xs flex items-start gap-2.5 shadow-sm backdrop-blur-sm max-w-2xl mx-auto">
      <i class="fa-solid fa-bullhorn text-amber-400 mt-0.5 text-sm shrink-0"></i>
      <p id="announcement-text" class="leading-relaxed flex-1"></p>
    </div>

    <!-- 搜尋與分類篩選列 -->
    <div class="max-w-xl mx-auto space-y-2.5">
      <div class="flex gap-2 items-center">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
          <input type="text" id="search-input" oninput="filterItems()" placeholder="搜尋物品名稱、求購或描述..." 
                 class="w-full pl-10 pr-4 py-2.5 bg-gray-800/90 text-gray-100 rounded-xl text-sm border border-gray-700 focus:outline-none focus:border-indigo-500 shadow-inner placeholder-gray-500 backdrop-blur-sm">
        </div>

        <!-- 🔵 藍色底亮眼凸顯的排版切換下拉選單 -->
        <div class="relative flex items-center shrink-0">
          <select id="grid-layout-select" onchange="changeGridLayout(this.value)" class="bg-blue-600 hover:bg-blue-500 text-white font-bold border-2 border-blue-400 rounded-xl text-xs px-3 py-2.5 shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition cursor-pointer">
            <option value="1" class="bg-gray-800 text-gray-100">單排 1 卡</option>
            <option value="2" class="bg-gray-800 text-gray-100">單排 2 卡 (手機建議)</option>
            <option value="3" class="bg-gray-800 text-gray-100">單排 3 卡</option>
            <option value="4" class="bg-gray-800 text-gray-100">單排 4 卡 (電腦預設)</option>
            <option value="5" class="bg-gray-800 text-gray-100">單排 5 卡</option>
          </select>
        </div>
      </div>
      
      <div class="grid grid-cols-4 gap-1.5 text-xs font-medium">
        <button onclick="setFilter('all')" id="btn-all" class="py-2 rounded-xl bg-indigo-600 text-white font-bold shadow-md transition">全部</button>
        <button onclick="setFilter('sell')" id="btn-sell" class="py-2 rounded-xl bg-gray-800/80 text-gray-300 border border-gray-700 hover:bg-gray-750 transition backdrop-blur-sm">💰 想賣</button>
        <button onclick="setFilter('buy')" id="btn-buy" class="py-2 rounded-xl bg-gray-800/80 text-gray-300 border border-gray-700 hover:bg-gray-750 transition backdrop-blur-sm">🔍 想買</button>
        <button onclick="setFilter('free')" id="btn-free" class="py-2 rounded-xl bg-gray-800/80 text-gray-300 border border-gray-700 hover:bg-gray-750 transition backdrop-blur-sm">🎁 免費送</button>
      </div>
    </div>

    <!-- 商品大廳外層容器 -->
    <div id="grid-container" class="mx-auto transition-all duration-300">
      <!-- 商品大廳：動態網格 -->
      <div id="item-grid" class="grid gap-3 sm:gap-4 transition-all duration-300">
        <p class="col-span-full text-gray-400 text-center py-12 text-sm">正在載入刊登項目中...</p>
      </div>
    </div>

  </main>

  <!-- 右下角懸浮刊登按鈕 -->
  <button onclick="openPostModal()" class="fixed right-4 bottom-6 bg-indigo-600 text-white font-bold px-4 py-3 rounded-full shadow-2xl hover:bg-indigo-500 active:scale-95 transition flex items-center gap-2 z-30 border border-indigo-400/30">
    <i class="fa-solid fa-plus text-lg"></i>
    <span class="text-sm">我要刊登</span>
  </button>

  <!-- 大圖與詳細內容 Modal -->
  <div id="image-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4" onclick="closeImageModal()">
    <div class="bg-gray-800 border border-gray-700 w-full max-w-md rounded-2xl overflow-hidden shadow-2xl relative flex flex-col max-h-[85vh]" onclick="event.stopPropagation()">
      <button onclick="closeImageModal()" class="absolute top-3 right-3 bg-gray-900/80 text-white w-8 h-8 rounded-full flex items-center justify-center text-lg z-10 hover:bg-gray-700 transition">&times;</button>

      <div id="modal-img-box" class="w-full bg-black flex items-center justify-center min-h-[200px] max-h-[350px] overflow-hidden"></div>

      <div class="p-4 space-y-3 overflow-y-auto">
        <div class="flex items-center justify-between">
          <span id="modal-badge" class="text-xs font-bold px-2.5 py-0.5 rounded-full"></span>
          <span id="modal-time" class="text-xs text-gray-400"></span>
        </div>
        <h3 id="modal-title" class="text-lg font-bold text-gray-100"></h3>
        <p id="modal-price" class="text-xl font-black text-indigo-400"></p>
        <div class="bg-gray-900/60 p-3 rounded-xl border border-gray-700/50">
          <p class="text-xs text-gray-400 mb-1">詳細說明：</p>
          <p id="modal-desc" class="text-sm text-gray-300 whitespace-pre-wrap leading-relaxed"></p>
        </div>
        <p id="modal-seller" class="text-xs text-gray-500"></p>

        <button id="modal-chat-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition text-sm flex items-center justify-center gap-2">
          <i class="fa-regular fa-comments"></i> 私訊聯繫
        </button>
      </div>
    </div>
  </div>

  <!-- 多功能管理員後台 Modal -->
  <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-gray-800 border border-gray-700 w-full max-w-3xl rounded-2xl overflow-hidden shadow-2xl p-5 space-y-4 max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h3 class="font-bold text-base text-gray-100 flex items-center gap-2">
          <i class="fa-solid fa-user-shield text-indigo-400"></i> 管理員控制台
        </h3>
        <button onclick="closeAdminModal()" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
      </div>

      <!-- 登入區域 (支援 Enter 鍵直接登入、大輸入框與高清對比) -->
      <form id="admin-login-box" onsubmit="event.preventDefault(); checkAdminPassword();" class="space-y-4 py-2">
        <div>
          <label class="block text-sm font-bold text-gray-200 mb-1.5">請輸入管理員密碼：</label>
          <input type="password" id="admin-password" onkeydown="if(event.key==='Enter'){checkAdminPassword();}" placeholder="請輸入密碼，按 Enter 即可進入" 
                 class="w-full p-3.5 bg-gray-900 border-2 border-indigo-500/70 focus:border-indigo-400 rounded-xl text-base text-white placeholder-gray-500 font-medium tracking-wider shadow-inner focus:outline-none focus:ring-2 focus:ring-indigo-500/40">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-bold text-base hover:bg-indigo-500 active:scale-98 transition shadow-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i> 登入後台 (按 Enter 亦可進入)
        </button>
      </form>

      <!-- 後台管理控制面板 -->
      <div id="admin-panel" class="hidden flex-1 overflow-y-auto space-y-4 text-xs pr-1">
        <div class="flex justify-between items-center bg-indigo-950/40 p-2.5 rounded-xl border border-indigo-800/40 text-indigo-300">
          <span class="font-medium">✅ 管理員已登入</span>
          <div class="flex items-center gap-2">
            <button onclick="exportItemsCSV()" class="bg-emerald-600/90 hover:bg-emerald-600 text-white px-2.5 py-1 rounded-lg font-bold flex items-center gap-1 transition shadow">
              <i class="fa-solid fa-file-csv"></i> 匯出 CSV 備份
            </button>
            <button onclick="logoutAdmin()" class="bg-red-600/80 hover:bg-red-600 text-white px-2 py-1 rounded-lg font-bold transition">登出</button>
          </div>
        </div>

        <div class="bg-gray-900/80 p-3 rounded-xl border border-gray-700 grid grid-cols-4 gap-2 text-center">
          <div>
            <p class="text-gray-400 text-[10px]">總刊登數</p>
            <p id="stat-total" class="text-base font-bold text-indigo-400">0</p>
          </div>
          <div>
            <p class="text-gray-400 text-[10px]">求購數量</p>
            <p id="stat-buy" class="text-base font-bold text-amber-400">0</p>
          </div>
          <div>
            <p class="text-gray-400 text-[10px]">免費贈送</p>
            <p id="stat-free" class="text-base font-bold text-emerald-400">0</p>
          </div>
          <div>
            <p class="text-gray-400 text-[10px]">📌 官方置頂</p>
            <p id="stat-pinned" class="text-base font-bold text-amber-300">0</p>
          </div>
        </div>

        <!-- 後台分頁 Tab -->
        <div class="flex gap-2 border-b border-gray-700 pb-2">
          <button onclick="switchAdminTab('items')" id="admin-tab-btn-items" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white font-bold transition flex items-center gap-1">
            <i class="fa-solid fa-list-check"></i> 刊登內容總管
          </button>
          <button onclick="switchAdminTab('settings')" id="admin-tab-btn-settings" class="px-3 py-1.5 rounded-xl bg-gray-800 text-gray-400 hover:text-gray-200 border border-gray-700 font-bold transition flex items-center gap-1">
            <i class="fa-solid fa-gear"></i> 全站公告與設定
          </button>
        </div>

        <!-- 分頁 1: 刊登內容總管清單 (寬敞大視覺與分類過濾) -->
        <div id="admin-tab-items" class="space-y-3">
          <div class="flex flex-wrap gap-2 items-center justify-between bg-gray-900/60 p-2.5 rounded-xl border border-gray-700/60">
            <div class="relative flex-1 min-w-[200px]">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
              <input type="text" id="admin-item-search" oninput="renderAdminItemList()" placeholder="搜尋刊登標題、描述或發布者暱稱..." class="w-full pl-8 pr-3 py-1.5 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex gap-1 text-[11px] font-bold">
              <button onclick="setAdminFilter('all')" id="admin-filter-all" class="px-2.5 py-1.5 rounded-lg bg-indigo-600 text-white transition shadow">全部</button>
              <button onclick="setAdminFilter('sell')" id="admin-filter-sell" class="px-2.5 py-1.5 rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700 transition">💰 想賣</button>
              <button onclick="setAdminFilter('buy')" id="admin-filter-buy" class="px-2.5 py-1.5 rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700 transition">🔍 想買</button>
              <button onclick="setAdminFilter('free')" id="admin-filter-free" class="px-2.5 py-1.5 rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700 transition">🎁 免費送</button>
              <button onclick="setAdminFilter('pinned')" id="admin-filter-pinned" class="px-2.5 py-1.5 rounded-lg bg-gray-800 text-amber-400 hover:bg-gray-700 transition">📌 已置頂</button>
            </div>
          </div>

          <div id="admin-item-list" class="space-y-2.5 max-h-[460px] overflow-y-auto pr-1">
            <!-- 動態渲染刊登列表 -->
          </div>
        </div>

        <!-- 分頁 2: 全站與公告設定 -->
        <div id="admin-tab-settings" class="hidden space-y-4">
          <div class="space-y-1.5">
            <label class="font-bold text-gray-200 block">📢 頂部告示板公告修改：</label>
            <textarea id="admin-announcement-input" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-gray-200 h-16 placeholder-gray-500" placeholder="寫下新的公告..."></textarea>
            <button onclick="updateAnnouncement()" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-1.5 rounded-xl font-bold transition">更新全站公告</button>
          </div>

          <div class="space-y-1.5 border-t border-gray-700 pt-3">
            <label class="font-bold text-gray-200 block">🖼️ 換全站桌面背景圖 (網址 URL)：</label>
            <div class="flex gap-2">
              <input type="text" id="bg-url-input" placeholder="貼上圖片 URL (留空還原預設)" class="flex-1 p-2 bg-gray-900 border border-gray-700 rounded-xl text-gray-100">
              <button onclick="changeBgImage()" class="bg-indigo-600 text-white px-3 rounded-xl font-bold hover:bg-indigo-500 transition">儲存背景</button>
            </div>
          </div>

          <div class="space-y-1.5 border-t border-gray-700 pt-3">
            <label class="font-bold text-gray-200 block">🔑 更換管理員密碼：</label>
            <div class="flex gap-2">
              <input type="password" id="new-admin-pwd" placeholder="新密碼" class="flex-1 p-2 bg-gray-900 border border-gray-700 rounded-xl text-gray-100">
              <button onclick="changeAdminPassword()" class="bg-emerald-600 text-white px-3 rounded-xl font-bold hover:bg-emerald-500 transition">修改密碼</button>
            </div>
          </div>

          <div class="space-y-1.5 border-t border-gray-700 pt-3">
            <label class="font-bold text-gray-200 block">🚫 敏感詞 / 禁詞過濾 (用逗號隔開)：</label>
            <input type="text" id="banned-words-input" placeholder="例如: 賭博,槍枝,黃牛" class="w-full p-2 bg-gray-900 border border-gray-700 rounded-xl text-gray-100">
            <button onclick="saveBannedWords()" class="w-full bg-gray-700 hover:bg-gray-600 text-gray-200 py-1.5 rounded-xl font-bold transition">儲存敏感詞設定</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- 刊登 / 編輯 Modal -->
  <div id="post-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">
    <div class="bg-gray-800 border border-gray-700 w-full max-w-md max-h-[90vh] rounded-t-2xl sm:rounded-2xl flex flex-col overflow-hidden">
      <div class="p-4 bg-gray-750 border-b border-gray-700 flex justify-between items-center">
        <h3 id="post-modal-title" class="font-bold text-base text-gray-100">刊登物品 / 發布求購</h3>
        <button onclick="closePostModal()" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
      </div>
      
      <form id="post-form" class="p-4 overflow-y-auto space-y-3.5 text-sm">
        <input type="hidden" id="editing-item-id" value="">

        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">刊登類型</label>
          <select id="type" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-gray-100" onchange="togglePriceInput()">
            <option value="sell">💰 我想賣</option>
            <option value="buy">🔍 想買/求購</option>
            <option value="free">🎁 免費贈送</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">上傳圖片 (選填)</label>
          <input type="file" id="image-input" accept="image/*" onchange="previewImageDimension(this)" class="w-full p-2 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-300 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
          <p id="img-dimension-badge" class="text-[10px] text-indigo-400 mt-1 hidden"></p>
        </div>

        <div>
          <input type="text" id="title" placeholder="標題 (例: 徵二手 iPhone 13 / 售9成新滑鼠)" required class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-gray-100 placeholder-gray-500">
        </div>

        <div id="price-container">
          <input type="text" id="price" placeholder="預售金額 / 徵求預算 ($)" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-gray-100 placeholder-gray-500">
        </div>

        <div>
          <textarea id="description" placeholder="補充描述 (如物品狀況、面交地點、預算範圍等)..." class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-gray-100 placeholder-gray-500 h-20"></textarea>
        </div>

        <div>
          <input type="text" id="contact" placeholder="(選填) Teams / LINE 聯絡方式" class="w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-gray-100 placeholder-gray-500">
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-500 transition shadow-lg">確認發布</button>
      </form>
    </div>
  </div>

  <!-- 聊天室 Modal -->
  <div id="chat-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-end sm:items-center justify-center z-50">
    <div class="bg-gray-800 border border-gray-700 w-full max-w-md h-[85vh] rounded-t-2xl sm:rounded-2xl flex flex-col overflow-hidden">
      <div class="p-4 bg-gray-750 border-b border-gray-700 flex justify-between items-center">
        <h3 id="chat-title" class="font-bold text-sm truncate text-gray-100">對話區</h3>
        <button onclick="closeChat()" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
      </div>
      <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-2.5 bg-gray-900 text-sm"></div>
      <div class="p-3 border-t border-gray-700 flex gap-2 bg-gray-800">
        <input type="text" id="chat-input" placeholder="輸入匿名訊息..." class="flex-1 p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-sm text-gray-100 focus:outline-none focus:border-indigo-500 placeholder-gray-500">
        <button onclick="sendMessage()" class="bg-indigo-600 text-white px-4 py-2.5 rounded-xl font-bold text-sm hover:bg-indigo-500 transition">發送</button>
      </div>
    </div>
  </div>

    async function loadGlobalPinnedIds() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?item_id=eq.SYSTEM_PINNED_IDS&select=*`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.length > 0) {
            globalPinnedIds = JSON.parse(data[0].content || '[]');
          }
        }
      } catch(e) {
        console.error('Load pinned error:', e);
      }
    }

    async function togglePinItem(id) {
      let pinned = [...globalPinnedIds];
      if (pinned.includes(id)) {
        pinned = pinned.filter(pId => pId !== id);
        showNotification('📌 已取消置頂 (手機與電腦已同步連動)', 'info');
      } else {
        pinned.push(id);
        showNotification('📌 已成功置頂！(手機與電腦已同步連動)', 'success');
      }
      
      globalPinnedIds = pinned;
      renderItems();
      renderAdminItemList();
      updateStats();

      // Sync to Supabase Database for 100% Mobile <-> PC Realtime Sync
      try {
        const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/messages?item_id=eq.SYSTEM_PINNED_IDS&select=id`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });
        const existing = await checkRes.json();

        if (existing && existing.length > 0) {
          await fetch(`${SUPABASE_URL}/rest/v1/messages?id=eq.${existing[0].id}`, {
            method: 'PATCH',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ content: JSON.stringify(pinned) })
          });
        } else {
          await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              item_id: 'SYSTEM_PINNED_IDS',
              sender_id: 'ADMIN',
              sender_name: 'ADMIN',
              content: JSON.stringify(pinned)
            })
          });
        }
      } catch(e) {
        console.error('Save pinned error:', e);
      }
    }

    function exportItemsCSV() {
      if (allItems.length === 0) {
        return alert('目前沒有任何刊登資料可供匯出！');
      }

      const pinnedIds = getPinnedItems();
      const headers = ['ID', '標題', '類型', '價格/預算', '詳細說明', '聯絡方式', '發布者暱稱', '設備識別碼 (Device ID)', '發布時間', '是否置頂'];

      const rows = allItems.map(item => {
        const typeLabel = item.type === 'buy' ? '想買' : (item.type === 'free' ? '免費送' : '想賣');
        const isPinned = pinnedIds.includes(item.id) ? '是' : '否';
        return [
          `"${(item.id || '').replace(/"/g, '""')}"`,
          `"${(item.title || '').replace(/"/g, '""')}"`,
          `"${typeLabel}"`,
          `"${(item.price || '').replace(/"/g, '""')}"`,
          `"${(item.description || '').replace(/"/g, '""')}"`,
          `"${(item.contact_info || '').replace(/"/g, '""')}"`,
          `"${(item.nickname || '').replace(/"/g, '""')}"`,
          `"${(item.device_id || '').replace(/"/g, '""')}"`,
          `"${item.created_at ? new Date(item.created_at).toLocaleString('zh-TW') : ''}"`,
          `"${isPinned}"`
        ].join(',');
      });

      const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      const link = document.createElement('a');
      const today = new Date().toISOString().slice(0, 10);
      link.setAttribute('href', url);
      link.setAttribute('download', `PEGA_二手交易_刊登紀錄備份_${today}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function timeAgo(dateString) {
      if (!dateString) return '剛剛';
      const date = new Date(dateString);
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);
      if (seconds < 60) return '剛剛';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}分鐘前`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}小時前`;
      return `${Math.floor(hours / 24)}天前`;
    }

    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxWidth = 800;
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = (maxWidth / width) * height;
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.7);
          };
        };
      });
    }

    const postForm = document.getElementById('post-form');
    if (postForm) {
      postForm.onsubmit = async (e) => {
        e.preventDefault();
        if (!db) return alert('資料庫未連線');

        const editingId = document.getElementById('editing-item-id').value;
        const isEditing = Boolean(editingId);

        if (!isEditing) {
          const userItems = allItems.filter(i => i.device_id === deviceId);
          if (userItems.length >= 5) {
            alert('⚠️ 刊登數量已達上限！為了避免洗板，每位同仁最多只能同時刊登 5 項物品。');
            return;
          }
        }

        const title = document.getElementById('title').value;
        const desc = document.getElementById('description').value;

        const bannedWordsStr = localStorage.getItem('pega_banned_words');
        if (bannedWordsStr) {
          const bannedWords = bannedWordsStr.split(',').map(w => w.trim()).filter(Boolean);
          for (let word of bannedWords) {
            if (title.includes(word) || desc.includes(word)) {
              alert(`🚫 刊登內容包含敏感詞「${word}」，請修改後再發布！`);
              return;
            }
          }
        }

        const btn = document.getElementById('submit-btn');
        btn.innerText = isEditing ? '儲存中...' : '發布中...';
        btn.disabled = true;

        let imageUrl = null;
        const fileInput = document.getElementById('image-input');
        
        if (fileInput && fileInput.files.length > 0) {
          const rawFile = fileInput.files[0];
          const compressedBlob = await compressImage(rawFile);
          const fileName = `${Date.now()}_${Math.random().toString(36).substr(2, 5)}.jpg`;

          const { error: uploadError } = await db.storage
            .from('item-images')
            .upload(fileName, compressedBlob, { contentType: 'image/jpeg' });

          if (uploadError) {
            alert('圖片上傳失敗：' + uploadError.message);
            btn.innerText = isEditing ? '儲存修改' : '確認發布';
            btn.disabled = false;
            return;
          }

          const { data: publicUrlData } = db.storage.from('item-images').getPublicUrl(fileName);
          imageUrl = publicUrlData.publicUrl;
        }

        const payload = {
          title: title,
          price: document.getElementById('price').value || '0',
          description: desc,
          type: document.getElementById('type').value,
          contact_info: document.getElementById('contact').value,
        };

        if (imageUrl) payload.image_url = imageUrl;

        let error = null;

        if (isEditing) {
          const res = await db.from('items').update(payload).eq('id', editingId);
          error = res.error;
        } else {
          payload.device_id = deviceId;
          payload.nickname = nickname;
          const res = await db.from('items').insert([payload]);
          error = res.error;
        }

        if (error) {
          alert((isEditing ? '修改' : '發布') + '失敗：' + error.message);
        } else {
          alert(isEditing ? '🎉 貼文更新成功！' : '🎉 刊登成功！');
          closePostModal();
          loadItems();
        }

        btn.innerText = '確認發布';
        btn.disabled = false;
      };
    }

    async function openChat(itemId, title) {
      currentItemId = itemId;
      document.getElementById('chat-title').innerText = title ? `匿名對話：${title}` : '匿名對話';
      document.getElementById('chat-modal').classList.remove('hidden');
      loadMessages();

      if (db) {
        if (chatSubscription) db.removeChannel(chatSubscription);
        chatSubscription = db.channel('public:messages')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `item_id=${itemId}` }, payload => {
            if (payload.new.sender_id !== deviceId) {
              appendMessage(payload.new);
            }
          })
          .subscribe();
      }

      // 手機輪詢備援機制 (每 3 秒自動載入最新訊息)
      if (chatPollInterval) clearInterval(chatPollInterval);
      chatPollInterval = setInterval(() => {
        if (currentItemId === itemId) {
          loadMessages();
        }
      }, 3000);
    }

    function closeChat() { 
      document.getElementById('chat-modal').classList.add('hidden'); 
      currentItemId = null;
      if (chatPollInterval) {
        clearInterval(chatPollInterval);
        chatPollInterval = null;
      }
    }

    async function loadMessages() {
      if (!db) return;
      const { data } = await db.from('messages').select('*').eq('item_id', currentItemId).order('created_at', { ascending: true });
      const msgBox = document.getElementById('chat-messages');
      if (!msgBox) return;
      msgBox.innerHTML = '';
      if (data) data.forEach(appendMessage);
    }

    function appendMessage(msg) {
      const msgBox = document.getElementById('chat-messages');
      if (!msgBox) return;
      const isMe = msg.sender_id === deviceId;
      const div = document.createElement('div');
      div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
      div.innerHTML = `
        <span class="text-[10px] text-gray-500 mb-0.5">${msg.sender_name || '匿名同仁'}</span>
        <div class="px-3.5 py-2 rounded-2xl max-w-[80%] text-sm ${isMe ? 'bg-indigo-600 text-white' : 'bg-gray-800 text-gray-200 border border-gray-700'}">
          ${msg.content || ''}
        </div>
      `;
      msgBox.appendChild(div);
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    let chatPollInterval = null;

    async function sendMessage() {
      if (!db) return alert('資料庫未連線');
      const input = document.getElementById('chat-input');
      const content = input.value.trim();
      if (!content) return;

      // 1. 零延遲：立即在對話視窗內繪製剛發出的訊息
      appendMessage({
        sender_id: deviceId,
        sender_name: nickname,
        content: content
      });

      input.value = '';

      // 2. 背景寫入 Supabase 資料庫
      try {
        await db.from('messages').insert([{
          item_id: currentItemId,
          sender_id: deviceId,
          sender_name: nickname,
          content: content
        }]);
      } catch(e) {
        console.error('Send message error:', e);
      }
    }

    // 🐛 網站問題回報與建議留言板 Logic
    // ==========================================
    let allIssues = [];
    let currentIssueFilter = 'all';

    function openIssueModal() {
      document.getElementById('issue-modal').classList.remove('hidden');
      const nicknameInput = document.getElementById('issue-nickname');
      if (nicknameInput && !nicknameInput.value) {
        nicknameInput.value = localStorage.getItem('pega_nickname') || '';
      }
      loadAndRenderIssues();
    }

    function closeIssueModal() {
      document.getElementById('issue-modal').classList.add('hidden');
    }

    async function fetchIssues() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?item_id=in.(ISSUE_OPEN,ISSUE_RESOLVED)&order=created_at.desc`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        if (!res.ok) return [];
        return await res.json();
      } catch(e) {
        console.error('Fetch issues error:', e);
        return [];
      }
    }

    async function loadAndRenderIssues() {
      const container = document.getElementById('issue-list-container');
      if (container) container.innerHTML = '<p class="text-gray-400 text-center py-6 text-xs animate-pulse">載入留言與問題中...</p>';

      allIssues = await fetchIssues();

      const openCount = allIssues.filter(i => i.item_id === 'ISSUE_OPEN').length;
      const badge = document.getElementById('issue-badge-count');
      if (badge) {
        badge.innerText = openCount;
        if (openCount > 0) badge.classList.remove('hidden');
        else badge.classList.add('hidden');
      }

      renderIssueList();
    }

    function setIssueFilter(filter) {
      currentIssueFilter = filter;
      ['all', 'open', 'resolved'].forEach(f => {
        const btn = document.getElementById('issue-filter-' + f);
        if (btn) {
          if (f === filter) {
            btn.className = f === 'resolved' ? 'px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-bold shadow' : 'px-2.5 py-1 rounded-lg bg-amber-600 text-gray-950 font-black shadow';
          } else {
            btn.className = f === 'resolved' ? 'px-2.5 py-1 rounded-lg bg-gray-800 text-emerald-400 hover:bg-gray-700' : 'px-2.5 py-1 rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700';
          }
        }
      });
      renderIssueList();
    }

    function renderIssueList() {
      const container = document.getElementById('issue-list-container');
      if (!container) return;

      const filtered = allIssues.filter(i => {
        if (currentIssueFilter === 'open') return i.item_id === 'ISSUE_OPEN';
        if (currentIssueFilter === 'resolved') return i.item_id === 'ISSUE_RESOLVED';
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center py-8 text-xs">尚無任何問題回報或留言記錄</p>';
        return;
      }

      const myDeviceId = getDeviceId();

      container.innerHTML = filtered.map(issue => {
        const isResolved = issue.item_id === 'ISSUE_RESOLVED';
        const isMine = issue.sender_id === myDeviceId;

        const safeContent = (issue.content || '').replace(/</g, "&lt;").replace(/>/g, "&gt;");

        return `
          <div class="p-3.5 rounded-2xl border ${isResolved ? 'bg-emerald-950/20 border-emerald-500/50 text-emerald-100 shadow-sm' : 'bg-gray-900/90 border-gray-700 text-gray-100 shadow-md'} transition space-y-2">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 flex-wrap">
                ${isResolved ? '<span class="bg-emerald-500 text-gray-950 font-black px-2 py-0.5 rounded-md text-[10px] shadow flex items-center gap-1"><i class="fa-solid fa-check"></i> ✅ 已解決</span>' : '<span class="bg-amber-500/90 text-gray-950 font-bold px-2 py-0.5 rounded-md text-[10px] shadow flex items-center gap-1"><i class="fa-solid fa-clock"></i> ⚡ 待處理</span>'}
                <span class="font-bold text-xs text-gray-200">${issue.sender_name || '熱心同仁'}</span>
                <span class="text-[10px] text-gray-500">(${issue.sender_id ? issue.sender_id.slice(0, 8) : 'anon'})</span>
              </div>
              <span class="text-[10px] text-gray-500">${timeAgo(issue.created_at)}</span>
            </div>

            <div class="text-xs text-gray-200 whitespace-pre-line leading-relaxed font-medium bg-black/30 p-2.5 rounded-xl border border-white/5">
              ${safeContent}
            </div>

            <div class="flex items-center justify-between pt-1 border-t border-gray-800/60 text-[11px]">
              <div class="flex items-center gap-1.5">
                ${isAdmin ? `
                  <button onclick="toggleIssueStatus('${issue.id}', '${issue.item_id}')" class="px-2.5 py-1 ${isResolved ? 'bg-gray-800 hover:bg-gray-700 text-amber-300 border border-amber-500/40' : 'bg-emerald-600 hover:bg-emerald-500 text-white font-bold'} rounded-lg transition flex items-center gap-1 shadow">
                    ${isResolved ? '↩️ 重新開啟' : '✅ 點擊標記為已解決'}
                  </button>
                ` : ''}
              </div>

              <div class="flex items-center gap-1.5">
                ${(isMine || isAdmin) ? `
                  <button onclick="editIssue('${issue.id}')"\'").replace(/
/g, "\n")}')" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 text-indigo-300 rounded-lg transition">
                    ✏️ 編輯
                  </button>
                  <button onclick="deleteIssue('${issue.id}')" class="px-2.5 py-1 bg-gray-800 hover:bg-red-900/60 text-red-400 rounded-lg transition">

      }).join('');

    async function submitNewIssue() {
      const nicknameInput = document.getElementById('issue-nickname');
      const contentInput = document.getElementById('issue-content');

      const nickname = (nicknameInput?.value || '').trim() || '熱心同仁';
      const content = (contentInput?.value || '').trim();

      if (!content) {
        showNotification('⚠️ 請輸入回報問題內容', 'warning');
        return;
      }

      localStorage.setItem('pega_nickname', nickname);
      const myDeviceId = getDeviceId();

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify({
            item_id: 'ISSUE_OPEN',
            sender_id: myDeviceId,
            sender_name: nickname,
            content: content
          })
        });

        if (res.ok) {
          showNotification('✅ 已成功發布問題回報與建議！', 'success');
          contentInput.value = '';
          loadAndRenderIssues();
        } else {
          showNotification('❌ 發布失敗，請再試一次', 'error');
        }
      } catch(e) {
        console.error('Submit issue error:', e);
        showNotification('❌ 發布出錯', 'error');
      }
    }

    async function toggleIssueStatus(issueId, currentStatus) {
      if (!isAdmin) return;
      const newStatus = currentStatus === 'ISSUE_RESOLVED' ? 'ISSUE_OPEN' : 'ISSUE_RESOLVED';
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?id=eq.${issueId}`, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ item_id: newStatus })
        });
        if (res.ok) {
          showNotification(newStatus === 'ISSUE_RESOLVED' ? '✅ 已標記該問題為【已解決】' : '↩️ 已重新開啟該問題', 'success');
          loadAndRenderIssues();
        }
      } catch(e) {
        console.error('Toggle issue error:', e);
      }
    }

    async function editIssue(issueId) {
      const targetIssue = allIssues.find(i => i.id === issueId);
      const oldContent = targetIssue ? (targetIssue.content || '') : '';
      const newContent = prompt('請修改回報內容：', oldContent);
      if (newContent === null || newContent.trim() === '') return;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?id=eq.${issueId}`, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ content: newContent.trim() })
        });
        if (res.ok) {
          showNotification('✏️ 回報內容已更新', 'success');
          loadAndRenderIssues();
        }
      } catch(e) {
        console.error('Edit issue error:', e);
      }
    }

    async function deleteIssue(issueId) {
      if (!confirm('確定要刪除這筆回報記錄嗎？')) return;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?id=eq.${issueId}`, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });
        if (res.ok) {
          showNotification('🗑️ 已刪除回報記錄', 'success');
          loadAndRenderIssues();
        }
      } catch(e) {
        console.error('Delete issue error:', e);
      }
    }

    function getRecoveryCode(devId) {
      if (!devId) return 'PEGA-8888';
      let hash = 0;
      for (let i = 0; i < devId.length; i++) {
        hash = ((hash << 5) - hash) + devId.charCodeAt(i);
        hash |= 0;
      }
      const codeNum = Math.abs(hash % 9000) + 1000;
      return `PEGA-${codeNum}`;
    }

      <div class="px-5 py-4 bg-gray-900/90 border-b border-gray-700 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-bold text-lg">
            🐛
          </div>
          <div>
            <h3 class="font-bold text-base text-gray-100 flex items-center gap-2">
              網站問題回報與建議留言板
            </h3>
            <p class="text-[11px] text-gray-400">歡迎同仁提出 Bug、改善建議或除錯回報</p>
          </div>
        </div>
        <button onclick="closeIssueModal()" class="text-gray-400 hover:text-white p-2 rounded-xl hover:bg-gray-800 transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Modal 內容主體 -->
      <div class="p-4 sm:p-5 overflow-y-auto space-y-4 flex-1">
        
        <!-- 新增留言輸入區 -->
        <form onsubmit="event.preventDefault(); submitNewIssue();" class="bg-gray-900/80 p-3.5 border border-gray-700/80 rounded-2xl space-y-3 shadow-inner">
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs font-bold text-amber-300 flex items-center gap-1">
              <i class="fa-solid fa-pen-to-square"></i> 填寫問題或建議回報：
            </span>
            <input type="text" id="issue-nickname" placeholder="您的暱稱" class="px-2.5 py-1 bg-gray-800 border border-gray-700 rounded-lg text-xs text-gray-200 focus:outline-none focus:border-amber-500 w-32">
          </div>
          <textarea id="issue-content" rows="2" placeholder="請詳細說明遇到的問題、操作畫面或改善建議..." class="w-full p-2.5 bg-gray-800 border border-gray-700 rounded-xl text-xs text-gray-100 placeholder-gray-500 focus:outline-none focus:border-amber-500 transition resize-none"></textarea>
          <div class="flex justify-end">
            <button type="submit" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-gray-950 font-bold text-xs rounded-xl transition shadow active:scale-95 flex items-center gap-1.5">
              <i class="fa-solid fa-paper-plane"></i> 發布回報
            </button>
          </div>
        </form>

        <!-- 留言板列表與篩選標籤 -->
        <div class="space-y-3">
          <div class="flex items-center justify-between bg-gray-900/50 p-2 rounded-xl border border-gray-700/60 flex-wrap gap-2">
            <span class="text-xs font-bold text-gray-300">📋 回報記錄列表：</span>
            <div class="flex gap-1 text-[11px] font-bold">
              <button onclick="setIssueFilter('all')" id="issue-filter-all" class="px-2.5 py-1 rounded-lg bg-amber-600 text-gray-950 font-black shadow">全部</button>
              <button onclick="setIssueFilter('open')" id="issue-filter-open" class="px-2.5 py-1 rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700">⚡ 待處理</button>
              <button onclick="setIssueFilter('resolved')" id="issue-filter-resolved" class="px-2.5 py-1 rounded-lg bg-gray-800 text-emerald-400 hover:bg-gray-700">✅ 已解決</button>
            </div>
          </div>

          <div id="issue-list-container" class="space-y-2.5 max-h-[350px] overflow-y-auto pr-1">
            <!-- 動態渲染問題回報清單 -->
          </div>
        </div>

      </div>

    </div>
  </div>

</body>
</html>
