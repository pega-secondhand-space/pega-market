<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Outer Card Frame -->
  <rect x="24" y="24" width="752" height="402" rx="20" fill="none" stroke="url(#cardBorder)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Left Graphic Banner -->
  <rect x="24" y="24" width="160" height="402" rx="20" fill="#f59e0b" fill-opacity="0.12"/>
  <circle cx="104" cy="120" r="48" fill="url(#goldGrad)" fill-opacity="0.2"/>
  <text x="104" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#fbbf24" text-anchor="middle">🎟️</text>
  <text x="104" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f59e0b" text-anchor="middle" letter-spacing="4">PEGA</text>
  <text x="104" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">WELFARE</text>
  <text x="104" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">VOUCHER</text>
  
  <!-- Dashed Cutout Line -->
  <line x1="184" y1="24" x2="184" y2="426" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="184" cy="24" r="14" fill="#0b0f19"/>
  <circle cx="184" cy="426" r="14" fill="#0b0f19"/>

  <!-- Right Ticket Body -->
  <g transform="translate(220, 0)">
    <!-- Corporate Sub-header -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="3">和碩聯合科技 員工福利委員會</text>
    
    <!-- Main Title -->
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="2">PEGA 文康禮券</text>
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#fbbf24">PEGATRON EMPLOYEES ACTIVITY COUPON</text>

    <!-- Value Badge / Description -->
    <rect x="0" y="235" width="510" height="72" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">適用通路：</text>
    <text x="105" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">特約各大百貨 / 飯店旅宿 / 影城餐飲</text>
    <text x="390" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#f59e0b">9 折 ~ 95 折</text>

    <!-- Footer Security Notice -->
    <text x="0" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">憑券抵用 • 和碩同仁專屬權益 • 歷史行情參考存檔</text>
    <rect x="420" y="342" width="90" height="26" rx="6" fill="#10b981" fill-opacity="0.2"/>
    <text x="465" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">✔ 正品無誤</text>
  </g>
</svg>
